# Example placeholder Kubernetes Secrets for a Popcorn deployment.
# Replace every value before use. Do not commit production secrets.
apiVersion: v1
kind: Secret
metadata:
  name: gateway-jwt-keys
type: Opaque
stringData:
  private.pem: replace-with-private-key-pem
  public.pem: replace-with-public-key-pem
---
apiVersion: v1
kind: Secret
metadata:
  name: pool-manager-env-secrets
type: Opaque
stringData:
  ADMIN_USER: admin
  ADMIN_PASS: replace-with-admin-password
  ADMIN_SESSION_SECRET: replace-with-random-admin-session-secret
  ADMIN_GOOGLE_CLIENT_ID: replace-with-google-client-id
  ADMIN_GOOGLE_CLIENT_SECRET: replace-with-google-client-secret
  SERVICE_AUTH_TOKEN: replace-with-service-token
---
apiVersion: v1
kind: Secret
metadata:
  name: pool-manager-admin-password-file
type: Opaque
stringData:
  admin.htpasswd: |
    admin:$2b$12$replace-with-bcrypt-hash
---
apiVersion: v1
kind: Secret
metadata:
  name: analytics-service-secret
type: Opaque
stringData:
  SERVICE_AUTH_TOKEN: replace-with-service-token
  ADMIN_TOKEN: replace-with-analytics-admin-token
---
apiVersion: v1
kind: Secret
metadata:
  name: analytics-db-secret
type: Opaque
stringData:
  host: postgres
  port: "5432"
  database: analytics
  username: analytics_admin
  password: replace-with-database-password
---
apiVersion: v1
kind: Secret
metadata:
  name: browser-turn-secret
type: Opaque
stringData:
  TURN_KEY_ID: replace-with-turn-key-id
  TURN_API_TOKEN: replace-with-turn-api-token
  NEKO_ICESERVERS: ""
