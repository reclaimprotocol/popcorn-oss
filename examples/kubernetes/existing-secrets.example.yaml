# Example placeholder Kubernetes Secrets for a Popcorn deployment.
# Replace every value before use. Do not commit production secrets.
apiVersion: v1
kind: Secret
metadata:
  name: gateway-jwt-keys
type: Opaque
stringData:
  private.pem: replace-with-private-key-pem
  public.pem: replace-with-public-key-pem
---
apiVersion: v1
kind: Secret
metadata:
  name: pool-manager-service-auth
type: Opaque
stringData:
  POOL_MANAGER_SERVICE_AUTH_TOKEN: replace-with-this-region-pool-manager-token
---
apiVersion: v1
kind: Secret
metadata:
  name: control-plane-secret
type: Opaque
stringData:
  CONTROL_PLANE_SERVICE_AUTH_TOKEN: replace-with-control-plane-service-token
  ADMIN_USER: admin
  ADMIN_PASS: replace-with-control-plane-admin-password
  ADMIN_SESSION_SECRET: replace-with-control-plane-admin-session-secret
  ADMIN_TOKEN: replace-with-control-plane-admin-token
  ADMIN_GOOGLE_CLIENT_ID: replace-with-google-client-id
  ADMIN_GOOGLE_CLIENT_SECRET: replace-with-google-client-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: analytics-db-secret
type: Opaque
stringData:
  host: replace-with-managed-postgres-host
  port: "5432"
  database: analytics
  username: analytics_admin
  password: replace-with-database-password
---
apiVersion: v1
kind: Secret
metadata:
  name: otel-clickhouse-secret
type: Opaque
stringData:
  CLICKHOUSE_ENDPOINT: replace-with-clickhouse-native-or-service-endpoint
  CLICKHOUSE_HTTP_ENDPOINT: replace-with-clickhouse-http-endpoint
  CLICKHOUSE_USERNAME: replace-with-clickhouse-username
  CLICKHOUSE_PASSWORD: replace-with-clickhouse-password
