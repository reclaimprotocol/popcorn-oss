# GCP Secret Manager External Secrets Operator example.
# The bundled charts expect a ClusterSecretStore named gcpsm.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gateway-jwt-keys
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcpsm
  target:
    name: gateway-jwt-keys
    creationPolicy: Owner
  data:
    - secretKey: private.pem
      remoteRef:
        key: popcorn/gateway/private.pem
    - secretKey: public.pem
      remoteRef:
        key: popcorn/gateway/public.pem
---
