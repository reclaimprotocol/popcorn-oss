# Provider-neutral External Secrets Operator example.
# Replace SecretStore names and remoteRef keys for your provider.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gateway-jwt-keys
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: popcorn-secrets
  target:
    name: gateway-jwt-keys
    creationPolicy: Owner
  data:
    - secretKey: private.pem
      remoteRef:
        key: popcorn/gateway/private.pem
    - secretKey: public.pem
      remoteRef:
        key: popcorn/gateway/public.pem
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pool-manager-env-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: popcorn-secrets
  target:
    name: pool-manager-env-secrets
    creationPolicy: Owner
  data:
    - secretKey: ADMIN_USER
      remoteRef:
        key: popcorn/pool-manager/admin-user
    - secretKey: ADMIN_PASS
      remoteRef:
        key: popcorn/pool-manager/admin-password
    - secretKey: ADMIN_SESSION_SECRET
      remoteRef:
        key: popcorn/pool-manager/admin-session-secret
    - secretKey: ADMIN_GOOGLE_CLIENT_ID
      remoteRef:
        key: popcorn/pool-manager/admin-google-client-id
    - secretKey: ADMIN_GOOGLE_CLIENT_SECRET
      remoteRef:
        key: popcorn/pool-manager/admin-google-client-secret
    - secretKey: SERVICE_AUTH_TOKEN
      remoteRef:
        key: popcorn/service-auth-token
---
