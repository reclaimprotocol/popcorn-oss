# GKE IP-only baseline values for the browser-fleet chart.
# Pair this with examples/helm/platform-ip-values.yaml.

region: us-central1
gatewayDomain: ""

agones:
  install: false

agonesInstaller:
  agones:
    controller:
      generateTLS: false
  gameservers:
    namespaces:
      - popcorn
    minPort: 59000
    maxPort: 59100

externalSecrets:
  enabled: false

imagePullSecrets: []

secrets:
  browserTurnName: browser-turn-secret

ccDevicePlugin:
  enabled: false

browserRuntimeImage: ghcr.io/reclaimprotocol/popcorn-oss/browser-runtime:REPLACE_WITH_COMMIT_SHA
browserRuntimeImagePullPolicy: IfNotPresent

browserRuntimeAttestor:
  enabled: false
  imagePullPolicy: IfNotPresent

browserRuntimeAttestorImage: ghcr.io/reclaimprotocol/popcorn-oss/browser-runtime-attestor:REPLACE_WITH_COMMIT_SHA

webrtc:
  advertiseHost: ""

fleet:
  replicas: 1
  scheduling: Packed
  health:
    initialDelaySeconds: 90
    periodSeconds: 5
    failureThreshold: 6
  browserRuntimeCpuRequest: "1000m"
  browserRuntimeCpuLimit: "2000m"
  browserRuntimeMemoryRequest: 2Gi
  browserRuntimeMemoryLimit: 4Gi

autoscaler:
  bufferSize: 1
  minReplicas: 1
  maxReplicas: 3
  syncSeconds: 30
