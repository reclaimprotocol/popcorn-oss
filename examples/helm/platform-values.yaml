# GCP example values for rendering the platform chart.
# Replace placeholders before installing into a GKE cluster.

clusterName: example-gke-cluster
provider: gcp
region: us-central1
registry: ghcr.io/reclaimprotocol/popcorn-oss
imageTag: latest

secrets:
  gatewayJwtName: gateway-jwt-keys
  poolManagerServiceAuthName: pool-manager-us-central1-service-auth
  controlPlaneName: control-plane-secret
  controlPlaneDatabaseName: analytics-db-secret
  browserTurnName: browser-turn-secret

poolManager:
  enabled: true
  replicas: 1
  imagePullPolicy: IfNotPresent
  redisHost: redis
  gameServerNamespace: ""
  gameServerFleet: browser-fleet
  serviceAuth:
    secretName: pool-manager-us-central1-service-auth
    secretKey: POOL_MANAGER_SERVICE_AUTH_TOKEN

gateway:
  enabled: true
  replicas: 1
  imagePullPolicy: IfNotPresent
  domainName: gateway.example.com
  staticIpName: ""
  serviceType: ClusterIP
  nodePorts: {}
  serviceAnnotations: {}
  backendConfig:
    enabled: false
    timeoutSec: 3600
    connectionDrainingTimeoutSec: 60
  jwtPrivateKeySecretId: ""
  jwtPublicKeySecretId: ""

redis:
  enabled: true
  replicas: 1
  image: redis:7-alpine
  imagePullPolicy: IfNotPresent

postgres:
  enabled: false
  image: postgres:16
  imagePullPolicy: IfNotPresent
  database: analytics
  username: analytics_admin
  hostAuthMethod: scram-sha-256
  storageSize: 20Gi
  storageClassName: ""
  passwordSecretKey: password

controlPlane:
  enabled: false
  replicas: 1
  imagePullPolicy: IfNotPresent
  nodeEnv: production
  databaseSsl: false
  serviceType: ClusterIP
  domainName: control-plane.example.com
  staticIpName: ""
  publicServicePort: 3000
  internalServiceUrl: ""
  regions:
    - name: us-central1
      clusterName: example-gke-cluster
      poolManagerUrl: http://pool-manager.default.svc.cluster.local
      publicGatewayUrl: https://gateway.example.com
      enabled: true
      poolManagerAuth:
        secretName: pool-manager-us-central1-service-auth
        secretKey: POOL_MANAGER_SERVICE_AUTH_TOKEN

metabase:
  enabled: false
  replicas: 1
  image: metabase/metabase:v0.57.6.x
  imagePullPolicy: IfNotPresent
  serviceType: ClusterIP
  publicServicePort: 3000
  domainName: metabase.example.com
  staticIpName: ""
  siteUrl: ""
  databaseName: metabase
  databaseSecretName: analytics-db-secret

ttlController:
  enabled: false
  replicas: 1
  imagePullPolicy: IfNotPresent
  controlPlaneUrl: ""
  ttlDuration: 15m

gkeNodePrescaler:
  enabled: false
  image: python:3.12-slim
  imagePullPolicy: IfNotPresent
  gcpServiceAccount: prescaler@example-project.iam.gserviceaccount.com
  project: example-project
  cluster: example-cluster
  location: us-central1
  nodePool: browser-pool
  namespace: ""
  fleetName: browser-fleet
  fleetAutoscalerName: browser-autoscaler
  intervalSeconds: 15
  podsPerNode: 4
  targetSessionsPerMinute: 5
  desiredCoverageMinutes: 2
  burstHeadroomGameServers: 0
  applyHeadroomOnlyWhenDemandAboveBaseline: true
  scaleAheadFreeSlots: 4
  maxNodesTotal: 0
  scaleUpCooldownSeconds: 30
  dryRun: true
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 200m

otel:
  enabled: false
  image: otel/opentelemetry-collector-contrib:0.149.0
  imagePullPolicy: IfNotPresent
  exporter:
    grpcEndpoint: https://otel-grpc.example.com:4317
    httpEndpoint: https://otel-http.example.com
  clickhouse:
    database: otel
    createSchema: false
    secretName: otel-clickhouse-secret
  agent:
    resources:
      requests:
        memory: 128Mi
        cpu: 100m
      limits:
        memory: 256Mi
        cpu: 250m
