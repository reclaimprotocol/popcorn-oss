# GKE production baseline values for the platform chart.
# Replace placeholders before installing into a GKE cluster.

clusterName: example-gke-cluster
provider: gcp
region: us-central1
registry: ghcr.io/reclaimprotocol/popcorn-oss
imageTag: latest

imagePullSecrets: []
nodeSelector: {}
tolerations: []
affinity: {}

secrets:
  gatewayJwtName: gateway-jwt-keys
  poolManagerServiceAuthName: pool-manager-us-central1-service-auth
  controlPlaneName: control-plane-secret
  controlPlaneDatabaseName: analytics-db-secret

poolManager:
  enabled: true
  replicas: 1
  imagePullPolicy: IfNotPresent
  redisHost: redis
  gameServerNamespace: ""
  gameServerFleet: browser-fleet
  serviceAuth:
    secretName: pool-manager-us-central1-service-auth
    secretKey: POOL_MANAGER_SERVICE_AUTH_TOKEN
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 500m

gateway:
  enabled: true
  replicas: 2
  imagePullPolicy: IfNotPresent
  domainName: gateway.example.com
  staticIpName: popcorn-gateway-ip
  serviceType: ClusterIP
  nodePorts: {}
  serviceAnnotations: {}
  backendConfig:
    enabled: false
    timeoutSec: 3600
    connectionDrainingTimeoutSec: 60
  jwtPrivateKeySecretId: ""
  jwtPublicKeySecretId: ""
  resources:
    requests:
      memory: 64Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 500m

redis:
  enabled: true
  replicas: 1
  image: redis:7-alpine
  imagePullPolicy: IfNotPresent
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 250m

controlPlane:
  enabled: true
  replicas: 1
  imagePullPolicy: IfNotPresent
  nodeEnv: production
  databaseSsl: false
  serviceType: ClusterIP
  domainName: control-plane.example.com
  staticIpName: popcorn-control-plane-ip
  publicServicePort: 3000
  sessionMaxTtlSeconds: 900
  regions:
    - name: us-central1
      clusterName: example-gke-cluster
      poolManagerUrl: http://pool-manager.popcorn.svc.cluster.local
      publicGatewayUrl: https://gateway.example.com
      enabled: true
      poolManagerAuth:
        secretName: pool-manager-us-central1-service-auth
        secretKey: POOL_MANAGER_SERVICE_AUTH_TOKEN
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m

metabase:
  enabled: false
  replicas: 1
  image: metabase/metabase:v0.57.6.x
  imagePullPolicy: IfNotPresent
  serviceType: ClusterIP
  publicServicePort: 3000
  domainName: metabase.example.com
  staticIpName: ""
  siteUrl: ""
  databaseName: metabase
  databaseSecretName: analytics-db-secret
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 1Gi
      cpu: "1000m"

ttlController:
  enabled: true
  replicas: 1
  imagePullPolicy: IfNotPresent
  controlPlaneUrl: ""
  ttlDuration: 15m
  resources:
    requests:
      memory: 64Mi
      cpu: 200m
    limits:
      memory: 128Mi
      cpu: 500m

gkeNodePrescaler:
  enabled: false
  image: python:3.12-slim
  imagePullPolicy: IfNotPresent
  gcpServiceAccount: prescaler@example-project.iam.gserviceaccount.com
  project: example-project
  cluster: example-cluster
  location: us-central1
  nodePool: browser-pool
  namespace: ""
  fleetName: browser-fleet
  fleetAutoscalerName: browser-autoscaler
  intervalSeconds: 15
  podsPerNode: 4
  targetSessionsPerMinute: 5
  desiredCoverageMinutes: 2
  burstHeadroomGameServers: 0
  applyHeadroomOnlyWhenDemandAboveBaseline: true
  scaleAheadFreeSlots: 4
  maxNodesTotal: 0
  scaleUpCooldownSeconds: 30
  dryRun: true
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 200m

otel:
  enabled: false
  image: otel/opentelemetry-collector-contrib:0.149.0
  imagePullPolicy: IfNotPresent
  exporter:
    grpcEndpoint: otel-grpc.example.com:4317
  clickhouse:
    database: otel
    secretName: otel-clickhouse-secret
  agent:
    resources:
      requests:
        memory: 128Mi
        cpu: 100m
      limits:
        memory: 256Mi
        cpu: 250m
