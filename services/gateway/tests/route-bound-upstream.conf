server {
    listen 80;
    server_name _;

    location /identity {
        return 200 "$request_method|$request_uri|$http_last_event_id|$http_x_popcorn_session_id|$http_x_popcorn_scope|$http_x_popcorn_expires_at|$http_authorization";
    }

    location / {
        add_header X-Popcorn-Test-Upstream routed always;
        return 200 "routed\n";
    }
}
