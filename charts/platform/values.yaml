clusterName: local
provider: gcp
region: asia-south1
registry: ghcr.io/reclaimprotocol/popcorn-oss
imageTag: latest

imagePullSecrets: []
nodeSelector: {}
tolerations: []
affinity: {}

secrets:
  gatewayJwtName: gateway-jwt-keys
  poolManagerServiceAuthName: pool-manager-service-auth
  controlPlaneName: control-plane-secret
  controlPlaneDatabaseName: analytics-db-secret

poolManager:
  enabled: false
  replicas: 1
  imagePullPolicy: Always
  redisHost: redis
  gameServerNamespace: ""
  gameServerFleet: browser-fleet
  jwtSecretName: ""
  extraSessionUrls: {}
  extraRoutePorts: {}
  serviceAuth:
    secretName: ""
    secretKey: POOL_MANAGER_SERVICE_AUTH_TOKEN
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 500m

gateway:
  enabled: true
  replicas: 1
  imagePullPolicy: Always
  domainName: ""
  staticIpName: ""
  serviceType: LoadBalancer
  redisHost: ""
  poolManagerHost: ""
  nodePorts: {}
  serviceAnnotations: {}
  extraSessionRoutes: []
  backendConfig:
    enabled: true
    timeoutSec: 3600
    connectionDrainingTimeoutSec: 60
  jwtSecretName: ""
  jwtPrivateKeySecretId: ""
  jwtPublicKeySecretId: ""
  resources:
    requests:
      memory: 64Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 500m

redis:
  enabled: false
  replicas: 1
  image: redis:7-alpine
  imagePullPolicy: IfNotPresent
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 250m

postgres:
  enabled: false
  image: postgres:16
  imagePullPolicy: IfNotPresent
  database: analytics
  username: analytics_admin
  hostAuthMethod: scram-sha-256
  storageSize: 20Gi
  storageClassName: ""
  existingSecretName: ""
  passwordSecretKey: password
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m

controlPlane:
  enabled: false
  replicas: 1
  imagePullPolicy: Always
  nodeEnv: production
  databaseSsl: false
  databaseSslCa: ""
  databaseSslCaFile: ""
  serviceType: ClusterIP
  domainName: ""
  staticIpName: ""
  publicServicePort: 3000
  sessionMaxTtlSeconds: 900
  nodePorts: {}
  secretName: ""
  databaseSecretName: ""
  serviceAuthSecretKey: CONTROL_PLANE_SERVICE_AUTH_TOKEN
  adminAuth:
    strategies: password,google
    sessionTtlSeconds: 43200
    sessionSecretKey: ADMIN_SESSION_SECRET
    userKey: ADMIN_USER
    passKey: ADMIN_PASS
    tokenKey: ADMIN_TOKEN
    passwordFileSecretName: ""
    passwordFileSecretKey: admin.htpasswd
    googleClientIdKey: ADMIN_GOOGLE_CLIENT_ID
    googleClientSecretKey: ADMIN_GOOGLE_CLIENT_SECRET
    googleRedirectUri: ""
    googleAllowedEmails: ""
    googleAllowedDomains: ""
  regions: []
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m

metabase:
  enabled: false
  replicas: 1
  image: metabase/metabase:v0.57.6.x
  imagePullPolicy: IfNotPresent
  serviceType: ClusterIP
  publicServicePort: 3000
  domainName: ""
  staticIpName: ""
  siteUrl: ""
  databaseName: metabase
  databaseSecretName: ""
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 1Gi
      cpu: "1000m"

ttlController:
  enabled: false
  replicas: 1
  imagePullPolicy: Always
  controlPlaneUrl: ""
  ttlDuration: 15m
  resources:
    requests:
      memory: 64Mi
      cpu: 200m
    limits:
      memory: 128Mi
      cpu: 500m

gkeNodePrescaler:
  enabled: false
  image: python:3.12-slim
  imagePullPolicy: IfNotPresent
  gcpServiceAccount: ""
  project: null
  cluster: ""
  location: ""
  nodePool: ""
  namespace: ""
  fleetName: browser-fleet
  fleetAutoscalerName: browser-autoscaler
  intervalSeconds: 15
  podsPerNode: 4
  targetSessionsPerMinute: 5
  desiredCoverageMinutes: 2
  burstHeadroomGameServers: 0
  applyHeadroomOnlyWhenDemandAboveBaseline: true
  scaleAheadFreeSlots: 4
  maxNodesTotal: 0
  scaleUpCooldownSeconds: 30
  dryRun: false
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 200m

otel:
  enabled: false
  image: otel/opentelemetry-collector-contrib:0.149.0
  imagePullPolicy: IfNotPresent
  exporter:
    grpcEndpoint: null
  clickhouse:
    database: otel
    secretName: otel-clickhouse-secret
  agent:
    resources:
      requests:
        memory: 128Mi
        cpu: 100m
      limits:
        memory: 256Mi
        cpu: 250m
