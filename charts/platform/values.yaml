clusterName: local
provider: gcp
region: asia-south1
registry: ghcr.io/reclaimprotocol/popcorn-oss
imageTag: latest

imagePullSecrets: []
nodeSelector: {}
tolerations: []
affinity: {}

secrets:
  gatewayJwtName: gateway-jwt-keys
  poolManagerServiceAuthName: pool-manager-service-auth
  controlPlaneName: control-plane-secret
  controlPlaneDatabaseName: analytics-db-secret

poolManager:
  enabled: false
  replicas: 1
  imagePullPolicy: Always
  redisHost: redis
  redisSecondaryHost: ""
  gameServerNamespace: ""
  gameServerFleet: browser-fleet
  jwtSecretName: ""
  extraSessionUrls: {}
  extraRoutePorts: {}
  serviceAuth:
    secretName: ""
    secretKey: POOL_MANAGER_SERVICE_AUTH_TOKEN
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 500m

gateway:
  enabled: true
  replicas: 1
  imagePullPolicy: Always
  updateStrategy:
    maxSurge: 1
    maxUnavailable: 0
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  topologySpreadConstraints: []
  terminationGracePeriodSeconds: 75
  gracefulShutdown:
    enabled: true
    delaySeconds: 60
  domainName: ""
  staticIpName: ""
  serviceType: LoadBalancer
  redisHost: ""
  poolManagerHost: ""
  nodePorts: {}
  serviceAnnotations: {}
  extraSessionRoutes: []
  backendConfig:
    enabled: true
    timeoutSec: 3600
    connectionDrainingTimeoutSec: 60
  jwtSecretName: ""
  jwtPrivateKeySecretId: ""
  jwtPublicKeySecretId: ""
  resources:
    requests:
      memory: 64Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 500m

redis:
  enabled: false
  replicas: 1
  image: redis:7-alpine
  imagePullPolicy: IfNotPresent
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 250m

redisHa:
  enabled: false
  fullnameOverride: redis-ha
  architecture: replication
  auth:
    enabled: false
  commonConfiguration: |-
    appendonly yes
    appendfsync everysec
    min-replicas-to-write 1
    min-replicas-max-lag 10
  replica:
    replicaCount: 3
    automountServiceAccountToken: true
    podAntiAffinityPreset: hard
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: redisHa
            app.kubernetes.io/component: node
    persistence:
      enabled: true
      storageClass: standard-rwo
      size: 8Gi
    pdb:
      create: true
      maxUnavailable: 1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
  sentinel:
    enabled: true
    image:
      digest: sha256:ae75dd69c192a632bdeb21baa6721080be5b12347e52add922036398b47631da
    masterSet: reclaim-master
    quorum: 2
    downAfterMilliseconds: 5000
    failoverTimeout: 30000
    parallelSyncs: 1
    masterService:
      enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 150m
        memory: 192Mi
  rbac:
    create: true
  serviceAccount:
    create: true
    automountServiceAccountToken: true
  image:
    digest: sha256:08863c2c3f4e051fb6139b38fa223e9c13be5033326a59bead182860d899bf98
  kubectl:
    image:
      digest: sha256:95de17e6eb92da83a58c90a9df0c4cede634f898d2e6b92ea04f4a6ee6ace08d

controlPlane:
  enabled: false
  replicas: 1
  imagePullPolicy: Always
  nodeEnv: production
  databaseSsl: false
  databaseSslCa: ""
  databaseSslCaFile: ""
  serviceType: ClusterIP
  domainName: ""
  staticIpName: ""
  publicServicePort: 3000
  publicPaths:
    - /
  additionalIngresses: []
  sessionMaxTtlSeconds: 900
  nodePorts: {}
  secretName: ""
  databaseSecretName: ""
  serviceAuthSecretKey: CONTROL_PLANE_SERVICE_AUTH_TOKEN
  adminAuth:
    strategies: password,google
    sessionTtlSeconds: 43200
    sessionSecretKey: ADMIN_SESSION_SECRET
    userKey: ADMIN_USER
    passKey: ADMIN_PASS
    tokenKey: ADMIN_TOKEN
    passwordFileSecretName: ""
    passwordFileSecretKey: admin.htpasswd
    googleClientIdKey: ADMIN_GOOGLE_CLIENT_ID
    googleClientSecretKey: ADMIN_GOOGLE_CLIENT_SECRET
    googleRedirectUri: ""
    googleAllowedEmails: ""
    googleAllowedDomains: ""
  regions: []
  x402:
    enabled: false
    testnet: false
    network: ""
    publicBaseUrl: ""
    payTo: ""
    maxExtensionBlocks: 12
    maxPaidBlocks: 12
    regionName: ""
    facilitatorUrl: ""
    trustedProxyHops: 1
    rateLimitPerMinute: 30
    secretName: control-plane-x402-secret
    serverSecretKey: X402_SERVER_SECRET
    baseRpcUrlSecretKey: X402_BASE_RPC_URL
    cdpApiKeyIdKey: CDP_API_KEY_ID
    cdpApiKeySecretKey: CDP_API_KEY_SECRET
    facilitatorAuthHeadersSecretKey: X402_FACILITATOR_AUTH_HEADERS
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m

ttlController:
  enabled: false
  replicas: 1
  imagePullPolicy: Always
  controlPlaneUrl: ""
  ttlDuration: 15m
  resources:
    requests:
      memory: 64Mi
      cpu: 200m
    limits:
      memory: 128Mi
      cpu: 500m

gkeNodePrescaler:
  enabled: false
  image: python:3.12-slim
  imagePullPolicy: IfNotPresent
  gcpServiceAccount: ""
  project: null
  cluster: ""
  location: ""
  nodePool: ""
  nodeScalingEnabled: true
  namespace: ""
  fleetName: browser-fleet
  fleetAutoscalerName: browser-autoscaler
  intervalSeconds: 15
  podsPerNode: 4
  nodeStep: 1
  emergencyNodeStep: 2
  lookaheadSeconds: 90
  targetSessionsPerMinute: 5
  desiredCoverageMinutes: 2
  burstHeadroomGameServers: 0
  applyHeadroomOnlyWhenDemandAboveBaseline: true
  dynamicBuffer:
    enabled: false
    patchFleetAutoscaler: true
    minReadyGameServers: 0
    maxReadyGameServers: 0
    leadSeconds: 180
    allocationWindowSeconds: 120
    safetyMarginGameServers: 0
    scaleDownDelaySeconds: 900
    decayStepGameServers: 5
    latencyDerivedEnabled: false
    trendWindowSeconds: 600
    protectionSeconds: 162
    roundingGameServers: 5
    plannedRatePerMinute: 0
    plannedRateBurstMultiplier: 1.1
    decayIntervalSeconds: 60
  scaleAheadFreeSlots: 4
  maxNodesTotal: 0
  scaleUpCooldownSeconds: 30
  cooldownBypassPendingPods: 1
  cooldownBypassOldestPendingSeconds: 20
  inflightResizeGraceSeconds: 180
  metrics:
    enabled: true
    port: 9102
  dryRun: false
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 200m

otel:
  enabled: false
  image: otel/opentelemetry-collector-contrib:0.149.0
  imagePullPolicy: IfNotPresent
  exporter:
    grpcEndpoint: null
    httpEndpoint: null
    headersSecretName: ""
    headers: {}
    tls: {}
  clickhouse:
    enabled: false
    database: otel
    secretName: otel-clickhouse-secret
  agent:
    nodeSelector: {}
    tolerations: []
    affinity: {}
    resources:
      requests:
        memory: 128Mi
        cpu: 100m
      limits:
        memory: 256Mi
        cpu: 250m
