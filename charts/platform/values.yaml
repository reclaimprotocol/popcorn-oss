clusterName: local
provider: gcp
region: asia-south1
registry: ghcr.io/reclaimprotocol/popcorn-oss
imageTag: latest

imagePullSecrets: []
nodeSelector: {}
tolerations: []
affinity: {}

secrets:
  gatewayJwtName: gateway-jwt-keys
  poolManagerServiceAuthName: pool-manager-service-auth
  browserRuntimeProxyName: browser-runtime-proxy-secret
  controlPlaneName: control-plane-secret
  controlPlaneDatabaseName: analytics-db-secret

# Merge-friendly session services shared with the browser-fleet chart. The
# platform consumes each enabled extension's `routing` section.
sessionExtensions: {}

# Optional remote MCP endpoint (services/mcp-server). Disabled by default.
# The OSS service performs browser operations only; usage credit, if any, is
# delegated to an operator-run billing service (see docs/mcp-server.md).
mcpServer:
  enabled: false
  replicas: 2
  imagePullPolicy: Always
  updateStrategy:
    maxSurge: 1
    maxUnavailable: 0
  # Public origin of the MCP endpoint, e.g. https://mcp.popcorn.example
  publicUrl: ""
  domainName: ""
  staticIpName: ""
  serviceType: ClusterIP
  servicePort: 80
  publicPaths:
    - /mcp
    - /oauth
    - /.well-known
    - /health
  allowedOrigins: []
  controlPlaneUrl: http://control-plane
  # One purchase/operation buys exactly this much browser time.
  sessionBlockSeconds: 600
  operationLeaseSeconds: 120
  billing:
    # none = every authenticated request is allowed (self-hosting default).
    # external = delegate balance/reserve/commit/release to `baseUrl`.
    provider: none
    baseUrl: ""
    # Key in `secretName` holding the service token for that billing API.
    authTokenKey: MCP_BILLING_AUTH_TOKEN
  # Secret holding DATABASE_URL, the token signing key, the control-plane
  # client credentials, and (for external billing) the billing service token.
  secretName: mcp-server-secret
  # Existing platform database Secret with host, port, database, username and password.
  databaseSecretName: analytics-db-secret
  secretKeys:
    tokenSigningKey: MCP_TOKEN_SIGNING_KEY
    popcornClientId: POPCORN_CLIENT_ID
    popcornClientSecret: POPCORN_CLIENT_SECRET
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m

poolManager:
  enabled: false
  replicas: 1
  imagePullPolicy: Always
  redisHost: redis
  redisSecondaryHost: ""
  gameServerNamespace: ""
  gameServerFleet: browser-fleet
  normalGameServerFleet: ""
  jwtSecretName: ""
  # `url`, `vncUrl`, and `vncWsUrl` are generated by the pool manager for every
  # successful session. The primary `url` is the built-in LiveView page.
  serviceAuth:
    secretName: ""
    secretKey: POOL_MANAGER_SERVICE_AUTH_TOKEN
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 500m

gateway:
  enabled: true
  replicas: 1
  imagePullPolicy: Always
  updateStrategy:
    maxSurge: 1
    maxUnavailable: 0
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  topologySpreadConstraints: []
  terminationGracePeriodSeconds: 75
  gracefulShutdown:
    enabled: true
    delaySeconds: 60
  domainName: ""
  staticIpName: ""
  serviceType: LoadBalancer
  redisHost: ""
  poolManagerHost: ""
  nodePorts: {}
  serviceAnnotations: {}
  backendConfig:
    enabled: true
    timeoutSec: 3600
    connectionDrainingTimeoutSec: 60
  jwtSecretName: ""
  jwtPrivateKeySecretId: ""
  jwtPublicKeySecretId: ""
  resources:
    requests:
      memory: 64Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 500m

redis:
  enabled: false
  replicas: 1
  image: redis:7-alpine
  imagePullPolicy: IfNotPresent
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 250m

redisHa:
  enabled: false
  fullnameOverride: redis-ha
  architecture: replication
  auth:
    enabled: false
  commonConfiguration: |-
    appendonly yes
    appendfsync everysec
    min-replicas-to-write 1
    min-replicas-max-lag 10
  replica:
    replicaCount: 3
    automountServiceAccountToken: true
    podAntiAffinityPreset: hard
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: redisHa
            app.kubernetes.io/component: node
    persistence:
      enabled: true
      storageClass: standard-rwo
      size: 8Gi
    pdb:
      create: true
      maxUnavailable: 1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
  sentinel:
    enabled: true
    image:
      digest: sha256:ae75dd69c192a632bdeb21baa6721080be5b12347e52add922036398b47631da
    # Historical stateful identifier. Keep stable across chart upgrades; new
    # installations may override it, but existing Sentinel deployments must not
    # rename it without a controlled Redis migration.
    masterSet: reclaim-master
    quorum: 2
    downAfterMilliseconds: 5000
    failoverTimeout: 30000
    parallelSyncs: 1
    masterService:
      enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 150m
        memory: 192Mi
  rbac:
    create: true
  serviceAccount:
    create: true
    automountServiceAccountToken: true
  image:
    digest: sha256:08863c2c3f4e051fb6139b38fa223e9c13be5033326a59bead182860d899bf98
  kubectl:
    image:
      digest: sha256:95de17e6eb92da83a58c90a9df0c4cede634f898d2e6b92ea04f4a6ee6ace08d

controlPlane:
  enabled: false
  replicas: 1
  updateStrategy:
    maxSurge: 1
    maxUnavailable: 0
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  topologySpreadConstraints: []
  imagePullPolicy: Always
  nodeEnv: production
  databaseSsl: false
  databaseSslCa: ""
  databaseSslCaFile: ""
  serviceType: ClusterIP
  domainName: ""
  staticIpName: ""
  publicServicePort: 3000
  publicPaths:
    - /
  additionalIngresses: []
  sessionMaxTtlSeconds: 900
  nodePorts: {}
  secretName: ""
  databaseSecretName: ""
  serviceAuthSecretKey: CONTROL_PLANE_SERVICE_AUTH_TOKEN
  adminAuth:
    strategies: password,google
    sessionTtlSeconds: 43200
    sessionSecretKey: ADMIN_SESSION_SECRET
    userKey: ADMIN_USER
    passKey: ADMIN_PASS
    tokenKey: ADMIN_TOKEN
    passwordFileSecretName: ""
    passwordFileSecretKey: admin.htpasswd
    googleClientIdKey: ADMIN_GOOGLE_CLIENT_ID
    googleClientSecretKey: ADMIN_GOOGLE_CLIENT_SECRET
    googleRedirectUri: ""
    googleAllowedEmails: ""
    googleAllowedDomains: ""
  regions: []
  x402:
    enabled: false
    testnet: false
    network: ""
    publicBaseUrl: ""
    payTo: ""
    blockSeconds: 300
    pricePerBlockAtomic: 10000
    paymentAssetAddress: ""
    paymentAssetName: ""
    paymentAssetVersion: "2"
    maxExtensionBlocks: 12
    maxPaidBlocks: 12
    regionName: ""
    facilitatorUrl: ""
    facilitatorAuthMode: auto
    trustedProxyHops: 1
    rateLimitPerMinute: 30
    secretName: control-plane-x402-secret
    serverSecretKey: X402_SERVER_SECRET
    baseRpcUrlSecretKey: X402_BASE_RPC_URL
    cdpApiKeyIdKey: CDP_API_KEY_ID
    cdpApiKeySecretKey: CDP_API_KEY_SECRET
    facilitatorAuthHeadersSecretKey: X402_FACILITATOR_AUTH_HEADERS
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m

ttlController:
  enabled: false
  replicas: 1
  imagePullPolicy: Always
  controlPlaneUrl: ""
  ttlDuration: 15m
  resources:
    requests:
      memory: 64Mi
      cpu: 200m
    limits:
      memory: 128Mi
      cpu: 500m

otel:
  enabled: false
  image: otel/opentelemetry-collector-contrib:0.149.0
  imagePullPolicy: IfNotPresent
  exporter:
    grpcEndpoint: null
    httpEndpoint: null
    headersSecretName: ""
    headers: {}
    tls: {}
  clickhouse:
    enabled: false
    database: otel
    secretName: otel-clickhouse-secret
  agent:
    nodeSelector: {}
    tolerations: []
    affinity: {}
    resources:
      requests:
        memory: 128Mi
        cpu: 100m
      limits:
        memory: 256Mi
        cpu: 250m
