{{- if .Values.otel.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-agent
  labels:
    app: otel-agent
spec:
  selector:
    matchLabels:
      app: otel-agent
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/otel-configmap.yaml") . | sha256sum }}
      labels:
        app: otel-agent
    spec:
      serviceAccountName: otel-agent
{{ include "popcorn-platform.podScheduling" (dict "root" .) | nindent 6 }}
      containers:
        - name: otel-agent
          image: {{ .Values.otel.image | quote }}
          imagePullPolicy: {{ .Values.otel.imagePullPolicy }}
          args:
            - --config=/conf/config.yaml
          env:
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            runAsUser: 0
          resources:
{{ toYaml .Values.otel.agent.resources | indent 12 }}
          volumeMounts:
            - name: config
              mountPath: /conf
              readOnly: true
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
            - name: varlogcontainers
              mountPath: /var/log/containers
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: otel-agent-config
        - name: varlogpods
          hostPath:
            path: /var/log/pods
        - name: varlogcontainers
          hostPath:
            path: /var/log/containers
{{- end }}
