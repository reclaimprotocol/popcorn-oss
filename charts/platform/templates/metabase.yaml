{{- if .Values.metabase.enabled }}
{{- $metabaseDatabaseSecret := default .Values.secrets.controlPlaneDatabaseName .Values.metabase.databaseSecretName }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metabase
  labels:
    app: metabase
spec:
  replicas: {{ .Values.metabase.replicas }}
  selector:
    matchLabels:
      app: metabase
  template:
    metadata:
      labels:
        app: metabase
    spec:
      securityContext:
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: metabase-db-bootstrap
          image: {{ .Values.postgres.image | quote }}
          imagePullPolicy: {{ .Values.postgres.imagePullPolicy }}
          command:
            - sh
            - -ec
            - |
              export PGPASSWORD="$MB_DB_PASS"
              until pg_isready -h "$MB_DB_HOST" -p "$MB_DB_PORT" -U "$MB_DB_USER" -d postgres; do
                sleep 2
              done

              if ! psql -h "$MB_DB_HOST" -p "$MB_DB_PORT" -U "$MB_DB_USER" -d postgres -Atqc "SELECT 1 FROM pg_database WHERE datname = '$MB_DB_DBNAME'" | grep -q 1; then
                psql -h "$MB_DB_HOST" -p "$MB_DB_PORT" -U "$MB_DB_USER" -d postgres -c "CREATE DATABASE \"$MB_DB_DBNAME\""
              fi
          env:
            - name: MB_DB_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ $metabaseDatabaseSecret | quote }}
                  key: host
            - name: MB_DB_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ $metabaseDatabaseSecret | quote }}
                  key: port
            - name: MB_DB_DBNAME
              value: {{ .Values.metabase.databaseName | quote }}
            - name: MB_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $metabaseDatabaseSecret | quote }}
                  key: username
            - name: MB_DB_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ $metabaseDatabaseSecret | quote }}
                  key: password
      containers:
        - name: metabase
          image: {{ .Values.metabase.image | quote }}
          imagePullPolicy: {{ .Values.metabase.imagePullPolicy }}
          env:
            - name: MB_JETTY_PORT
              value: "3000"
            - name: MB_SITE_URL
              value: {{ default (printf "https://%s" .Values.metabase.domainName) .Values.metabase.siteUrl | quote }}
            - name: MB_DB_TYPE
              value: postgres
            - name: MB_DB_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ $metabaseDatabaseSecret | quote }}
                  key: host
            - name: MB_DB_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ $metabaseDatabaseSecret | quote }}
                  key: port
            - name: MB_DB_DBNAME
              value: {{ .Values.metabase.databaseName | quote }}
            - name: MB_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $metabaseDatabaseSecret | quote }}
                  key: username
            - name: MB_DB_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ $metabaseDatabaseSecret | quote }}
                  key: password
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 1Gi
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 120
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: metabase
spec:
  type: {{ .Values.metabase.serviceType }}
  selector:
    app: metabase
  ports:
    - name: http
      port: {{ .Values.metabase.publicServicePort }}
      targetPort: 3000
      protocol: TCP
{{- end }}
