{{- if and (or .Values.gateway.enabled .Values.poolManager.enabled) .Values.gateway.jwtPrivateKeySecretId .Values.gateway.jwtPublicKeySecretId }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.gateway.jwtSecretName }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcpsm
  target:
    name: {{ .Values.gateway.jwtSecretName }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: private.pem
      remoteRef:
        key: {{ .Values.gateway.jwtPrivateKeySecretId | quote }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: public.pem
      remoteRef:
        key: {{ .Values.gateway.jwtPublicKeySecretId | quote }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
{{- end }}
