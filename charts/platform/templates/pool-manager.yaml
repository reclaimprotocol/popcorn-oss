{{- if .Values.poolManager.enabled }}
{{- $poolManagerSecret := default .Values.secrets.poolManagerName .Values.poolManager.adminAuth.sessionSecretName }}
{{- $poolManagerServiceAuthSecret := default .Values.secrets.poolManagerServiceAuthName .Values.poolManager.serviceAuth.secretName }}
{{- $controlPlaneSecret := default .Values.secrets.controlPlaneName .Values.controlPlane.secretName }}
{{- $legacyAnalyticsSecret := default "analytics-service-secret" .Values.secrets.analyticsServiceName }}
{{- $gatewayJwtSecret := default .Values.secrets.gatewayJwtName .Values.poolManager.jwtSecretName }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pool-manager
  labels:
    app: pool-manager
spec:
  replicas: {{ .Values.poolManager.replicas }}
  selector:
    matchLabels:
      app: pool-manager
  template:
    metadata:
      labels:
        app: pool-manager
    spec:
      serviceAccountName: pool-manager
      volumes:
        - name: jwt-keys
          secret:
            secretName: {{ $gatewayJwtSecret | quote }}
            items:
              - key: private.pem
                path: private.pem
{{- if .Values.poolManager.adminAuth.passwordFileSecretName }}
        - name: admin-password-file
          secret:
            secretName: {{ .Values.poolManager.adminAuth.passwordFileSecretName | quote }}
            items:
              - key: {{ .Values.poolManager.adminAuth.passwordFileSecretKey | quote }}
                path: admin.htpasswd
{{- end }}
      containers:
        - name: pool-manager
          image: "{{ .Values.registry }}/pool-manager:{{ .Values.imageTag }}"
          imagePullPolicy: {{ .Values.poolManager.imagePullPolicy }}
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: jwt-keys
              mountPath: /app/keys
              readOnly: true
{{- if .Values.poolManager.adminAuth.passwordFileSecretName }}
            - name: admin-password-file
              mountPath: /app/auth/admin.htpasswd
              subPath: admin.htpasswd
              readOnly: true
{{- end }}
          env:
            - name: REDIS_HOST
              value: {{ .Values.poolManager.redisHost | quote }}
            - name: ADMIN_AUTH_STRATEGIES
              value: {{ .Values.poolManager.adminAuth.strategies | quote }}
            - name: ADMIN_SESSION_TTL_SECONDS
              value: {{ .Values.poolManager.adminAuth.sessionTtlSeconds | quote }}
            - name: ADMIN_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $poolManagerSecret | quote }}
                  key: {{ .Values.poolManager.adminAuth.sessionSecretKey | quote }}
                  optional: true
{{- if .Values.poolManager.adminAuth.passwordFileSecretName }}
            - name: ADMIN_PASSWORD_FILE
              value: /app/auth/admin.htpasswd
{{- end }}
            - name: CONTROL_PLANE_URL
              value: {{ default (default (printf "http://control-plane.%s.svc.cluster.local:3000" .Release.Namespace) .Values.poolManager.analyticsServiceUrl) .Values.poolManager.controlPlaneUrl | quote }}
            - name: ANALYTICS_SERVICE_URL
              value: {{ default (default (printf "http://control-plane.%s.svc.cluster.local:3000" .Release.Namespace) .Values.poolManager.controlPlaneUrl) .Values.poolManager.analyticsServiceUrl | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: GAME_SERVER_NAMESPACE
              value: {{ default .Release.Namespace .Values.poolManager.gameServerNamespace | quote }}
            - name: GAME_SERVER_FLEET
              value: {{ .Values.poolManager.gameServerFleet | quote }}
            - name: POPCORN_REGION
              value: {{ .Values.region | quote }}
            - name: OTEL_CLICKHOUSE_ENABLED
              value: {{ ternary "true" "false" .Values.otel.enabled | quote }}
            - name: CONTROL_PLANE_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $controlPlaneSecret | quote }}
                  key: {{ .Values.controlPlane.serviceAuthSecretKey | quote }}
                  optional: true
            - name: ANALYTICS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $legacyAnalyticsSecret | quote }}
                  key: SERVICE_AUTH_TOKEN
                  optional: true
            - name: POOL_MANAGER_SERVICE_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $poolManagerServiceAuthSecret | quote }}
                  key: {{ .Values.poolManager.serviceAuth.secretKey | quote }}
                  optional: true
            - name: SERVICE_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $poolManagerServiceAuthSecret | quote }}
                  key: {{ .Values.poolManager.serviceAuth.secretKey | quote }}
                  optional: true
            - name: CLUSTER_NAME
              valueFrom:
                configMapKeyRef:
                  name: cluster-config
                  key: cluster_name
{{- if .Values.otel.enabled }}
            - name: OTEL_CLICKHOUSE_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.otel.clickhouse.secretName | quote }}
                  key: CLICKHOUSE_ENDPOINT
            - name: OTEL_CLICKHOUSE_HTTP_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.otel.clickhouse.secretName | quote }}
                  key: CLICKHOUSE_HTTP_ENDPOINT
            - name: OTEL_CLICKHOUSE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.otel.clickhouse.secretName | quote }}
                  key: CLICKHOUSE_USERNAME
            - name: OTEL_CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.otel.clickhouse.secretName | quote }}
                  key: CLICKHOUSE_PASSWORD
            - name: OTEL_CLICKHOUSE_DATABASE
              value: {{ .Values.otel.clickhouse.database | quote }}
{{- end }}
          envFrom:
            - secretRef:
                name: {{ $poolManagerSecret | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: pool-manager
spec:
  selector:
    app: pool-manager
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
{{- end }}
