{{- if .Values.poolManager.enabled }}
{{- $gameServerNamespace := default .Release.Namespace .Values.poolManager.gameServerNamespace }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-killer
  namespace: {{ $gameServerNamespace | quote }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
  - apiGroups: ["agones.dev"]
    resources: ["gameservers"]
    verbs: ["get", "list", "watch", "patch", "delete"]
  - apiGroups: ["allocation.agones.dev"]
    resources: ["gameserverallocations"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pool-manager-pod-killer
  namespace: {{ $gameServerNamespace | quote }}
subjects:
  - kind: ServiceAccount
    name: pool-manager
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: pod-killer
  apiGroup: rbac.authorization.k8s.io
{{- end }}
