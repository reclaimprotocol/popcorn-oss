{{- $mcp := .Values.mcpServer }}
{{- if and $mcp.enabled $mcp.staticIpName }}
{{- if $mcp.domainName }}
apiVersion: networking.gke.io/v1beta1
kind: FrontendConfig
metadata:
  name: mcp-server
spec:
  redirectToHttps:
    enabled: true
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: mcp-server
spec:
  domains:
    - {{ $mcp.domainName | quote }}
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-server
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.global-static-ip-name: {{ $mcp.staticIpName | quote }}
{{- if $mcp.domainName }}
    networking.gke.io/managed-certificates: mcp-server
    networking.gke.io/v1beta1.FrontendConfig: mcp-server
{{- end }}
spec:
  rules:
{{- if $mcp.domainName }}
    - host: {{ $mcp.domainName | quote }}
      http:
        paths:
{{- range $path := $mcp.publicPaths }}
          - path: {{ $path | quote }}
            pathType: Prefix
            backend:
              service:
                name: mcp-server
                port:
                  number: {{ $mcp.servicePort }}
{{- end }}
{{- else }}
    - http:
        paths:
{{- range $path := $mcp.publicPaths }}
          - path: {{ $path | quote }}
            pathType: Prefix
            backend:
              service:
                name: mcp-server
                port:
                  number: {{ $mcp.servicePort }}
{{- end }}
{{- end }}
{{- end }}
