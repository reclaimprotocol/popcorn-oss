{{- $mcp := .Values.mcpServer }}
{{- if $mcp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  labels:
    app: mcp-server
spec:
  replicas: {{ $mcp.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ $mcp.updateStrategy.maxSurge }}
      maxUnavailable: {{ $mcp.updateStrategy.maxUnavailable }}
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
    spec:
{{ include "popcorn-platform.podScheduling" (dict "root" .) | nindent 6 }}
      containers:
        - name: mcp-server
          image: "{{ .Values.registry }}/mcp-server:{{ .Values.imageTag }}"
          imagePullPolicy: {{ $mcp.imagePullPolicy }}
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: MCP_PUBLIC_URL
              value: {{ required "mcpServer.publicUrl is required when mcpServer.enabled" $mcp.publicUrl | quote }}
            - name: CONTROL_PLANE_URL
              value: {{ $mcp.controlPlaneUrl | quote }}
            - name: MCP_SESSION_TTL_SECONDS
              value: {{ $mcp.sessionBlockSeconds | quote }}
            - name: MCP_OPERATION_LEASE_SECONDS
              value: {{ $mcp.operationLeaseSeconds | quote }}
            - name: MCP_BILLING_PROVIDER
              value: {{ $mcp.billing.provider | quote }}
            {{- if eq $mcp.billing.provider "external" }}
            - name: MCP_BILLING_BASE_URL
              value: {{ required "mcpServer.billing.baseUrl is required for external billing" $mcp.billing.baseUrl | quote }}
            - name: MCP_BILLING_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $mcp.secretName | quote }}
                  key: {{ $mcp.billing.authTokenKey | quote }}
            {{- end }}
            {{- with $mcp.allowedOrigins }}
            - name: MCP_ALLOWED_ORIGINS
              value: {{ join "," . | quote }}
            {{- end }}
            # Reuse the platform PostgreSQL database. MCP owns only mcp_* tables.
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ $mcp.databaseSecretName | quote }}
                  key: host
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef: { name: {{ $mcp.databaseSecretName | quote }}, key: port }
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: { name: {{ $mcp.databaseSecretName | quote }}, key: database }
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: {{ $mcp.databaseSecretName | quote }}, key: username }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ $mcp.databaseSecretName | quote }}, key: password }
            - name: MCP_TOKEN_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "mcpServer.secretName is required when mcpServer.enabled" $mcp.secretName | quote }}
                  key: {{ $mcp.secretKeys.tokenSigningKey | quote }}
            - name: POPCORN_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $mcp.secretName | quote }}
                  key: {{ $mcp.secretKeys.popcornClientId | quote }}
            - name: POPCORN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $mcp.secretName | quote }}
                  key: {{ $mcp.secretKeys.popcornClientSecret | quote }}
          ports:
            - containerPort: 3000
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
{{ toYaml $mcp.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-server
{{- if $mcp.staticIpName }}
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
{{- end }}
spec:
  type: {{ if $mcp.staticIpName }}ClusterIP{{ else }}{{ $mcp.serviceType }}{{ end }}
  selector:
    app: mcp-server
  ports:
    - name: http
      port: {{ $mcp.servicePort }}
      targetPort: 3000
      protocol: TCP
{{- end }}
