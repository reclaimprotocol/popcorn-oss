{{- if .Values.analytics.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  generateName: analytics-service-migrate-
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: analytics-service-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: analytics-service-migrate
          image: "{{ .Values.registry }}/analytics-service:{{ .Values.imageTag }}"
          imagePullPolicy: {{ .Values.analytics.imagePullPolicy }}
          command: ["bun", "run", "db:migrate"]
          env:
            - name: NODE_ENV
              value: {{ .Values.analytics.nodeEnv | quote }}
            - name: DATABASE_SSL
              value: {{ include "popcorn-platform.analyticsDatabaseSsl" . | quote }}
            {{- if .Values.analytics.databaseSslCa }}
            - name: DATABASE_SSL_CA
              value: {{ .Values.analytics.databaseSslCa | quote }}
            {{- end }}
            {{- if .Values.analytics.databaseSslCaFile }}
            - name: DATABASE_SSL_CA_FILE
              value: {{ .Values.analytics.databaseSslCaFile | quote }}
            {{- end }}
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: analytics-db-secret
                  key: host
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: analytics-db-secret
                  key: port
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: analytics-db-secret
                  key: database
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: analytics-db-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: analytics-db-secret
                  key: password
{{- end }}
