{{- if .Values.otel.enabled }}
{{- $otelClusterRoleName := printf "%s-otel-agent" .Release.Name | trunc 63 | trimSuffix "-" }}
{{- $otelClusterRoleBindingName := printf "%s-otel-agent" .Release.Name | trunc 63 | trimSuffix "-" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $otelClusterRoleName | quote }}
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $otelClusterRoleBindingName | quote }}
subjects:
  - kind: ServiceAccount
    name: otel-agent
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ $otelClusterRoleName | quote }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
