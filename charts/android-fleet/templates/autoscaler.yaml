{{- if .Values.autoscaler.enabled }}
apiVersion: autoscaling.agones.dev/v1
kind: FleetAutoscaler
metadata:
  name: android-fleet-autoscaler
  namespace: {{ .Release.Namespace }}
spec:
  fleetName: android-fleet
  policy:
    type: Buffer
    buffer:
      # Emulators boot in minutes, so the buffer is what makes a session feel
      # immediate: it is the number of devices already warm and unallocated.
      bufferSize: {{ .Values.autoscaler.bufferSize }}
      minReplicas: {{ .Values.autoscaler.minReplicas }}
      maxReplicas: {{ .Values.autoscaler.maxReplicas }}
{{- end }}
