{{- $kvm := .Values.kvm | default dict }}
{{- $mode := default "devicePlugin" $kvm.mode }}
{{- if not (has $mode (list "devicePlugin" "hostPath" "none")) }}
{{- fail "kvm.mode must be one of 'devicePlugin', 'hostPath' or 'none'" }}
{{- end }}
apiVersion: agones.dev/v1
kind: Fleet
metadata:
  name: android-fleet
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.fleet.replicas }}
  scheduling: {{ .Values.fleet.scheduling }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 50%
  template:
    metadata:
      labels:
        app: android-runtime
    spec:
      container: android-runtime
      health:
        initialDelaySeconds: {{ .Values.fleet.health.initialDelaySeconds }}
        periodSeconds: {{ .Values.fleet.health.periodSeconds }}
        failureThreshold: {{ .Values.fleet.health.failureThreshold }}
      ports:
        - name: liveview
          containerPort: 6080
          portPolicy: None
          protocol: TCP
        - name: automation
          containerPort: 3000
          portPolicy: None
          protocol: TCP
{{- range $extensionName, $extension := .Values.sessionExtensions }}
{{- if dig "enabled" true $extension }}
{{- with dig "android" "ports" (list) $extension }}
{{ tpl (toYaml .) $ | nindent 8 }}
{{- end }}
{{- end }}
{{- end }}
      template:
        # Agones does NOT copy GameServer labels onto the pod it creates, so a
        # label set only on the GameServer template selects nothing. The
        # NetworkPolicy matches pods, and this runtime has no authentication of
        # its own, so a policy that silently selects zero pods would leave the
        # live view and automation API open to anything in the cluster.
        metadata:
          labels:
            app: android-runtime
        spec:
{{- if .Values.serviceAccount.create }}
          serviceAccountName: android-sa
          automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
{{- $selector := merge (dict) (default (dict) .Values.fleet.nodeSelector) (default (dict) $kvm.nodeSelector) }}
{{- with $selector }}
          nodeSelector:
{{ toYaml . | nindent 12 }}
{{- end }}
{{- with .Values.fleet.tolerations }}
          tolerations:
{{ toYaml . | nindent 12 }}
{{- end }}
{{- with .Values.fleet.affinity }}
          affinity:
{{ toYaml . | nindent 12 }}
{{- end }}
{{- with .Values.imagePullSecrets }}
          imagePullSecrets:
{{ toYaml . | nindent 12 }}
{{- end }}
          containers:
            - name: android-runtime
              image: {{ .Values.androidRuntimeImage | quote }}
              imagePullPolicy: {{ .Values.androidRuntimeImagePullPolicy }}
              resources:
                requests:
                  memory: {{ .Values.fleet.memoryRequest }}
                  cpu: {{ .Values.fleet.cpuRequest | quote }}
{{- if eq $mode "devicePlugin" }}
                  {{ $kvm.resourceName }}: "1"
{{- end }}
                limits:
                  memory: {{ .Values.fleet.memoryLimit }}
                  cpu: {{ .Values.fleet.cpuLimit | quote }}
{{- if eq $mode "devicePlugin" }}
                  {{ $kvm.resourceName }}: "1"
{{- end }}
              securityContext:
{{- if eq $mode "hostPath" }}
                # A hostPath device node can only be opened by a privileged
                # container. This is an escalation; prefer the device plugin.
                privileged: true
{{- else }}
                allowPrivilegeEscalation: false
                privileged: false
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
{{- end }}
              env:
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: NODE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
                - name: EMULATOR_MODE
                  value: {{ .Values.runtime.mode | quote }}
                - name: ANDROID_SERIAL
                  value: {{ .Values.runtime.serial | quote }}
{{- with .Values.runtime.adbServerHost }}
                - name: ADB_SERVER_HOST
                  value: {{ . | quote }}
                - name: ADB_SERVER_PORT
                  value: {{ $.Values.runtime.adbServerPort | quote }}
{{- end }}
                - name: ANDROID_GPU_MODE
                  value: {{ .Values.runtime.gpuMode | quote }}
                - name: STREAM_MAX_SIZE
                  value: {{ .Values.runtime.streamMaxSize | quote }}
                - name: STREAM_BITRATE
                  value: {{ .Values.runtime.streamBitrate | quote }}
                - name: BOOT_TIMEOUT_SECONDS
                  value: {{ .Values.runtime.bootTimeoutSeconds | quote }}
                - name: LIVEVIEW_READ_ONLY
                  value: {{ .Values.runtime.readOnly | quote }}
                - name: AUTOMATION_ALLOW_SHELL
                  value: {{ .Values.runtime.allowShell | quote }}
                - name: EMULATOR_WIPE_DATA
                  value: {{ .Values.runtime.wipeData | quote }}
                - name: REQUIRE_KVM
                  value: {{ and (ne $mode "none") (ne .Values.runtime.mode "attach") | quote }}
{{- with .Values.extraRuntimeEnv }}
{{ tpl (toYaml .) $ | nindent 16 }}
{{- end }}
              volumeMounts:
                - mountPath: /dev/shm
                  name: dshm
{{- if eq $mode "hostPath" }}
                - mountPath: /dev/kvm
                  name: kvm
{{- end }}
{{- range $extensionName, $extension := .Values.sessionExtensions }}
{{- if dig "enabled" true $extension }}
{{- with dig "android" "containers" (list) $extension }}
{{ tpl (toYaml .) $ | nindent 12 }}
{{- end }}
{{- end }}
{{- end }}
          volumes:
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: 2Gi
{{- if eq $mode "hostPath" }}
            - name: kvm
              hostPath:
                path: /dev/kvm
                type: CharDevice
{{- end }}
