{{- $browserRuntimeProxySecret := default "browser-runtime-proxy-secret" .Values.secrets.browserRuntimeProxyName }}
{{- $securityProfile := default "legacy" .Values.browserRuntimeSecurityProfile }}
{{- if not (has $securityProfile (list "legacy" "hardened")) }}
{{- fail "browserRuntimeSecurityProfile must be one of 'legacy' or 'hardened'" }}
{{- end }}
{{- $agonesReadyEndpoints := list }}
{{- if .Values.browserRuntimeAttestor.enabled }}
{{- $agonesReadyEndpoints = append $agonesReadyEndpoints "browser-runtime-attestor|http://127.0.0.1:8085/health" }}
{{- end }}
{{- range $extensionName, $extension := .Values.sessionExtensions }}
{{- if dig "enabled" true $extension }}
{{- range $container := dig "browser" "containers" (list) $extension }}
{{- $probe := get $container "readinessProbe" | default dict }}
{{- $httpGet := get $probe "httpGet" | default dict }}
{{- $port := get $httpGet "port" }}
{{- if not (regexMatch "^[0-9]+$" (toString $port)) }}
{{- fail (printf "sessionExtensions.%s browser container %s requires an HTTP readinessProbe with a numeric port before Agones can mark it ready" $extensionName $container.name) }}
{{- end }}
{{- $scheme := lower (default "HTTP" (get $httpGet "scheme")) }}
{{- $path := default "/" (get $httpGet "path") }}
{{- $agonesReadyEndpoints = append $agonesReadyEndpoints (printf "%s|%s://127.0.0.1:%v%s" $container.name $scheme $port $path) }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: agones.dev/v1
kind: Fleet
metadata:
  name: browser-fleet
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.fleet.replicas }}
  scheduling: {{ .Values.fleet.scheduling }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 50%
  template:
    metadata:
      labels:
        app: browser-runtime
    spec:
      container: browser-runtime
      health:
        initialDelaySeconds: {{ .Values.fleet.health.initialDelaySeconds }}
        periodSeconds: {{ .Values.fleet.health.periodSeconds }}
        failureThreshold: {{ .Values.fleet.health.failureThreshold }}
      ports:
        - name: novnc
          containerPort: 6080
          portPolicy: None
          protocol: TCP
        - name: cdp
          containerPort: 9222
          portPolicy: None
          protocol: TCP
        - name: cdp-internal
          containerPort: 9226
          portPolicy: None
          protocol: TCP
{{- range $extensionName, $extension := .Values.sessionExtensions }}
{{- if dig "enabled" true $extension }}
{{- with dig "browser" "ports" (list) $extension }}
{{ tpl (toYaml .) $ | nindent 8 }}
{{- end }}
{{- end }}
{{- end }}
      template:
        metadata:
          labels:
            app: browser-runtime
        spec:
{{- if .Values.serviceAccount.create }}
          serviceAccountName: browser-sa
          automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
{{- with .Values.runtimeClassName }}
          runtimeClassName: {{ . | quote }}
{{- end }}
{{- with .Values.fleet.nodeSelector }}
          nodeSelector:
{{ toYaml . | nindent 12 }}
{{- end }}
{{- with .Values.fleet.tolerations }}
          tolerations:
{{ toYaml . | nindent 12 }}
{{- end }}
{{- with .Values.fleet.affinity }}
          affinity:
{{ toYaml . | nindent 12 }}
{{- end }}
{{- with .Values.podSecurityContext }}
          securityContext:
{{- toYaml . | nindent 12 }}
{{- end }}
{{- with .Values.imagePullSecrets }}
          imagePullSecrets:
{{ toYaml . | nindent 12 }}
{{- end }}
          containers:
            - name: browser-runtime
              image: {{ .Values.browserRuntimeImage | quote }}
              imagePullPolicy: {{ .Values.browserRuntimeImagePullPolicy }}
              resources:
                requests:
                  memory: {{ .Values.fleet.browserRuntimeMemoryRequest }}
                  cpu: {{ .Values.fleet.browserRuntimeCpuRequest | quote }}
                limits:
                  memory: {{ .Values.fleet.browserRuntimeMemoryLimit }}
                  cpu: {{ .Values.fleet.browserRuntimeCpuLimit | quote }}
              securityContext:
{{- if eq $securityProfile "hardened" }}
                allowPrivilegeEscalation: false
                privileged: false
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
{{- else }}
                capabilities:
                  add: ["SYS_ADMIN"]
{{- end }}
              env:
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                - name: POD_UID
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.uid
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: NODE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
                - name: REDIS_HOST
                  value: redis
                - name: AGONES_READY_ENDPOINTS
                  value: {{ join " " $agonesReadyEndpoints | quote }}
                - name: HTTPS_PROXY_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ $browserRuntimeProxySecret | quote }}
                      key: HTTPS_PROXY_URL
                      optional: true
                - name: REPLACE_DEFAULT_PAGE
                  value: {{ eq .Values.browserPolicy.variant "reclaim-portal" | quote }}
                - name: POPCORN_BROWSER_STREAMING_MODE
                  value: "vnc"
{{- if dig "browser-events" "enabled" false .Values.sessionExtensions }}
                - name: POST_PROOF_LOGIN_REPAIR_ENABLED
                  value: {{ dig "enabled" false (.Values.browserEventsPostProofLoginRepair | default dict) | quote }}
                - name: BROWSER_EVENTS_BOOTSTRAP_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: browser-events-bootstrap
                      key: secret
{{- end }}
{{- with .Values.extraBrowserRuntimeEnv }}
{{ tpl (toYaml .) $ | nindent 16 }}
{{- end }}
              volumeMounts:
                - mountPath: /dev/shm
                  name: dshm
                - mountPath: /var/log/app
                  name: app-logs
{{- if .Values.browserRuntimeAttestor.enabled }}
            - name: browser-runtime-attestor
              image: {{ .Values.browserRuntimeAttestorImage | quote }}
              imagePullPolicy: {{ .Values.browserRuntimeAttestor.imagePullPolicy }}
              resources:
                requests:
                  memory: {{ .Values.fleet.browserRuntimeAttestorMemoryRequest }}
                  cpu: {{ .Values.fleet.browserRuntimeAttestorCpuRequest | quote }}
                  google.com/cc: "1"
                limits:
                  memory: {{ .Values.fleet.browserRuntimeAttestorMemoryLimit }}
                  cpu: {{ .Values.fleet.browserRuntimeAttestorCpuLimit | quote }}
                  google.com/cc: "1"
              ports:
                - name: proof-http
                  containerPort: 8085
                  protocol: TCP
              readinessProbe:
                httpGet:
                  path: /health
                  port: proof-http
                periodSeconds: 1
              env:
                - name: HOSTNAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                - name: ATTESTATION_TOKEN_AUDIENCE
                  value: {{ printf "https://%s" .Values.gatewayDomain | quote }}
                - name: CONFIDENTIAL_COMPUTING_LOCATION
                  value: {{ .Values.region | quote }}
                - name: TPM_EVENT_LOG_PATH
                  value: /var/run/cc/tpm0/binary_bios_measurements
              volumeMounts:
                - mountPath: /var/run/cc/tpm0
                  name: tpm-eventlog
                  readOnly: true
{{- end }}
{{- range $extensionName, $extension := .Values.sessionExtensions }}
{{- if dig "enabled" true $extension }}
{{- with dig "browser" "containers" (list) $extension }}
{{ tpl (toYaml .) $ | nindent 12 }}
{{- end }}
{{- end }}
{{- end }}
          volumes:
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: 2Gi
            - name: app-logs
              emptyDir: {}
{{- if .Values.browserRuntimeAttestor.enabled }}
            - name: tpm-eventlog
              hostPath:
                path: /sys/kernel/security/tpm0
                type: Directory
{{- end }}
