{{- $root := . }}
{{- $fleets := list (dict "name" "browser-fleet" "replicas" $root.Values.fleet.replicas "kiosk" true) }}
{{- if $root.Values.normalViewFleet.enabled }}
{{- $fleets = append $fleets (dict "name" $root.Values.normalViewFleet.name "replicas" $root.Values.normalViewFleet.replicas "kiosk" false) }}
{{- end }}
{{- range $fleet := $fleets }}
{{- $browserRuntimeProxySecret := default "browser-runtime-proxy-secret" $root.Values.secrets.browserRuntimeProxyName }}
{{- $securityProfile := default "legacy" $root.Values.browserRuntimeSecurityProfile }}
{{- if not (has $securityProfile (list "legacy" "hardened")) }}
{{- fail "browserRuntimeSecurityProfile must be one of 'legacy' or 'hardened'" }}
{{- end }}
apiVersion: agones.dev/v1
kind: Fleet
metadata:
  name: {{ $fleet.name }}
  namespace: {{ $root.Release.Namespace }}
spec:
  replicas: {{ $fleet.replicas }}
  scheduling: {{ $root.Values.fleet.scheduling }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 50%
  template:
    metadata:
      labels:
        app: browser-runtime
    spec:
      container: browser-runtime
      health:
        initialDelaySeconds: {{ $root.Values.fleet.health.initialDelaySeconds }}
        periodSeconds: {{ $root.Values.fleet.health.periodSeconds }}
        failureThreshold: {{ $root.Values.fleet.health.failureThreshold }}
      ports:
        - name: novnc
          containerPort: 6080
          portPolicy: None
          protocol: TCP
        - name: cdp
          containerPort: 9222
          portPolicy: None
          protocol: TCP
        - name: cdp-internal
          containerPort: 9226
          portPolicy: None
          protocol: TCP
{{- range $extensionName, $extension := $root.Values.sessionExtensions }}
{{- if dig "enabled" true $extension }}
{{- with dig "browser" "ports" (list) $extension }}
{{ tpl (toYaml .) $root | nindent 8 }}
{{- end }}
{{- end }}
{{- end }}
      template:
        spec:
{{- if $root.Values.serviceAccount.create }}
          serviceAccountName: browser-sa
          automountServiceAccountToken: {{ $root.Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
{{- with $root.Values.runtimeClassName }}
          runtimeClassName: {{ . | quote }}
{{- end }}
{{- with $root.Values.fleet.nodeSelector }}
          nodeSelector:
{{ toYaml . | nindent 12 }}
{{- end }}
{{- with $root.Values.fleet.tolerations }}
          tolerations:
{{ toYaml . | nindent 12 }}
{{- end }}
{{- with $root.Values.fleet.affinity }}
          affinity:
{{ toYaml . | nindent 12 }}
{{- end }}
{{- with $root.Values.podSecurityContext }}
          securityContext:
{{- toYaml . | nindent 12 }}
{{- end }}
{{- with $root.Values.imagePullSecrets }}
          imagePullSecrets:
{{ toYaml . | nindent 12 }}
{{- end }}
          containers:
            - name: browser-runtime
              image: {{ $root.Values.browserRuntimeImage | quote }}
              imagePullPolicy: {{ $root.Values.browserRuntimeImagePullPolicy }}
              resources:
                requests:
                  memory: {{ $root.Values.fleet.browserRuntimeMemoryRequest }}
                  cpu: {{ $root.Values.fleet.browserRuntimeCpuRequest | quote }}
                limits:
                  memory: {{ $root.Values.fleet.browserRuntimeMemoryLimit }}
                  cpu: {{ $root.Values.fleet.browserRuntimeCpuLimit | quote }}
              securityContext:
{{- if eq $securityProfile "hardened" }}
                allowPrivilegeEscalation: false
                privileged: false
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
{{- else }}
                capabilities:
                  add: ["SYS_ADMIN"]
{{- end }}
              env:
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                - name: POD_UID
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.uid
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: NODE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
                - name: REDIS_HOST
                  value: redis
                - name: HTTPS_PROXY_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ $browserRuntimeProxySecret | quote }}
                      key: HTTPS_PROXY_URL
                      optional: true
                - name: REPLACE_DEFAULT_PAGE
                  value: {{ eq $root.Values.browserPolicy.variant "reclaim-portal" | quote }}
                - name: POPCORN_BROWSER_STREAMING_MODE
                  value: "vnc"
                - name: BROWSER_KIOSK
                  value: {{ $fleet.kiosk | quote }}
{{- with $root.Values.extraBrowserRuntimeEnv }}
{{ tpl (toYaml .) $root | nindent 16 }}
{{- end }}
              volumeMounts:
                - mountPath: /dev/shm
                  name: dshm
                - mountPath: /var/log/app
                  name: app-logs
{{- if $root.Values.browserRuntimeAttestor.enabled }}
            - name: browser-runtime-attestor
              image: {{ $root.Values.browserRuntimeAttestorImage | quote }}
              imagePullPolicy: {{ $root.Values.browserRuntimeAttestor.imagePullPolicy }}
              resources:
                requests:
                  memory: {{ $root.Values.fleet.browserRuntimeAttestorMemoryRequest }}
                  cpu: {{ $root.Values.fleet.browserRuntimeAttestorCpuRequest | quote }}
                  google.com/cc: "1"
                limits:
                  memory: {{ $root.Values.fleet.browserRuntimeAttestorMemoryLimit }}
                  cpu: {{ $root.Values.fleet.browserRuntimeAttestorCpuLimit | quote }}
                  google.com/cc: "1"
              ports:
                - name: proof-http
                  containerPort: 8085
                  protocol: TCP
              env:
                - name: HOSTNAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                - name: ATTESTATION_TOKEN_AUDIENCE
                  value: {{ printf "https://%s" $root.Values.gatewayDomain | quote }}
                - name: CONFIDENTIAL_COMPUTING_LOCATION
                  value: {{ $root.Values.region | quote }}
                - name: TPM_EVENT_LOG_PATH
                  value: /var/run/cc/tpm0/binary_bios_measurements
              volumeMounts:
                - mountPath: /var/run/cc/tpm0
                  name: tpm-eventlog
                  readOnly: true
{{- end }}
{{- range $extensionName, $extension := $root.Values.sessionExtensions }}
{{- if dig "enabled" true $extension }}
{{- with dig "browser" "containers" (list) $extension }}
{{ tpl (toYaml .) $root | nindent 12 }}
{{- end }}
{{- end }}
{{- end }}
          volumes:
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: 2Gi
            - name: app-logs
              emptyDir: {}
{{- if $root.Values.browserRuntimeAttestor.enabled }}
            - name: tpm-eventlog
              hostPath:
                path: /sys/kernel/security/tpm0
                type: Directory
{{- end }}
{{- end }}
