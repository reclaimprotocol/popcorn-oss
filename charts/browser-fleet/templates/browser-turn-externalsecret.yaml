{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: browser-turn-secret
  namespace: {{ .Release.Namespace }}
  finalizers:
    - externalsecrets.external-secrets.io/externalsecret-cleanup
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcpsm
  target:
    name: browser-turn-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: TURN_KEY_ID
      remoteRef:
        key: browser-turn-key-id
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: TURN_API_TOKEN
      remoteRef:
        key: browser-turn-api-token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
{{- end }}
