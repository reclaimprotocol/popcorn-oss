{{- if .Values.externalSecrets.enabled }}
{{- $browserRuntimeProxySecret := default "browser-runtime-proxy-secret" .Values.secrets.browserRuntimeProxyName }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $browserRuntimeProxySecret }}
  namespace: {{ .Release.Namespace }}
  finalizers:
    - externalsecrets.external-secrets.io/externalsecret-cleanup
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcpsm
  target:
    name: {{ $browserRuntimeProxySecret }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: HTTPS_PROXY_URL
      remoteRef:
        key: browser-runtime-https-proxy-url
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    {{- with .Values.secrets.browserRuntimeGrassProxyRemoteKey }}
    # Optional secondary proxy template; reclaim-api selects it per request with proxyProvider=grass.
    - secretKey: HTTPS_PROXY_URL_GRASS
      remoteRef:
        key: {{ . }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    {{- end }}
{{- end }}
