{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: browser-runtime-egress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: browser-runtime
  policyTypes:
    - Egress
  egress:
    # GKE DNS is the only permitted private-name service.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Browser runtimes publish their per-session route endpoints only to this
    # cluster's Redis. Keep the exception selector-scoped so the public fleet
    # cannot reach arbitrary private services.
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
{{- with .Values.networkPolicy.kubernetesApiCidr }}
    # Agones injects its own service account only into the SDK sidecar when the
    # Fleet does not provide one. The browser container remains tokenless, but
    # the sidecar still needs this narrow path to the Kubernetes API.
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        - protocol: TCP
          port: 443
{{- end }}
    # Public web access, excluding private, carrier-grade NAT, loopback,
    # link-local/metadata, benchmark, multicast, and reserved destinations.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 224.0.0.0/4
              - 240.0.0.0/4
{{- end }}
