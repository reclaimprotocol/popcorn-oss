title = "Popcorn OSS secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "Known protocol and identifier strings that are not credentials"
regexTarget = "match"
regexes = [
  '''claimKey: x402OperationClaims\.claimKey''',
  '''Sec-WebSocket-Key", "dGhlIHNhbXBsZSBub25jZQ==''',
]

[[allowlists]]
description = "Synthetic WebSocket handshake nonce in the viewer handoff test"
condition = "AND"
paths = ['''^images/minimal-vnc-desktop/proxy/viewer_handoff_test\.go$''']
regexTarget = "match"
regexes = ['''Sec-WebSocket-Key: dGVzdC13cy1rZXk=''']
