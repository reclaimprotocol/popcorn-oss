<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Native select overlay POC</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #eef4ff;
      color: #172554;
      font-family: system-ui, -apple-system, sans-serif;
    }
    header {
      padding: 18px 20px;
      background: #172554;
      color: #fff;
      font-weight: 900;
    }
    main { padding: 20px 16px; }
    .ready {
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: #2b005f;
      color: #fff;
      font-weight: 900;
    }
    .explanation {
      margin: 18px 0;
      font-size: 14px;
      line-height: 1.4;
    }
    .framebuffer {
      padding: 18px;
      border: 3px solid #94a3b8;
      border-radius: 18px;
      background:
        linear-gradient(135deg, rgba(255,255,255,.05) 25%, transparent 25%) 0 0/12px 12px,
        #20242d;
      color: #f8fafc;
      box-shadow: 0 14px 30px rgba(15, 23, 42, .16);
    }
    .framebuffer-label {
      margin-bottom: 16px;
      color: #cbd5e1;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .12em;
    }
    .field-label { margin-bottom: 8px; font-weight: 800; }
    .proxy-anchor { position: relative; }
    .remote-select {
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border: 3px solid #f59e0b;
      border-radius: 13px;
      background: #fef3c7;
      color: #172554;
      font-size: 20px;
      font-weight: 750;
    }
    .remote-select::after { content: "⌄"; font-size: 26px; }
    /*
      This is the POC: the real local select receives the tap while the streamed
      framebuffer-like control remains visible. Keep it enabled and tappable;
      display:none, visibility:hidden, or pointer-events:none cannot open iOS UI.
    */
    #native-select-proxy {
      position: absolute;
      inset: 0;
      z-index: 2;
      width: 100%;
      height: 100%;
      margin: 0;
      border: 0;
      border-radius: 13px;
      background: transparent;
      color: transparent;
      -webkit-appearance: none;
      appearance: none;
      cursor: pointer;
    }
    .focus-marker {
      height: 12px;
      margin-top: 10px;
      border-radius: 999px;
      background: #00cfff;
      visibility: hidden;
    }
    .proxy-active .focus-marker { visibility: visible; }
    .event-log {
      margin-top: 16px;
      padding: 13px;
      border-radius: 12px;
      background: #0f172a;
      color: #dbeafe;
      font: 13px/1.45 ui-monospace, SFMono-Regular, monospace;
    }
    .success {
      display: none;
      min-height: 58px;
      margin-top: 16px;
      place-items: center;
      border-radius: 13px;
      background: #00d084;
      color: #052e16;
      font-weight: 950;
      text-align: center;
    }
    .done .success { display: grid; }
  </style>
</head>
<body>
  <header>LOCAL NATIVE SELECT PROXY POC</header>
  <main>
    <div class="ready">READY</div>
    <p class="explanation">
      The dark card represents streamed pixels. The visible account field is a
      fake remote control; a transparent local HTML select is aligned over it.
    </p>
    <section class="framebuffer" aria-label="Mock streamed framebuffer">
      <div class="framebuffer-label">STREAMED FRAMEBUFFER MOCK</div>
      <div class="field-label">Account type</div>
      <div class="proxy-anchor" id="proxy-anchor">
        <div class="remote-select" aria-hidden="true">
          <span id="remote-value">Personal</span>
        </div>
        <select id="native-select-proxy" aria-label="Account type">
          <option value="personal">Personal</option>
          <option value="business">Business</option>
          <option value="enterprise">Enterprise</option>
        </select>
      </div>
      <div class="focus-marker"></div>
      <div class="event-log" id="event-log">remote state: personal</div>
      <div class="success">NATIVE SELECTION REACHED REMOTE STATE</div>
    </section>
  </main>
  <script>
    const proxy = document.querySelector('#native-select-proxy');
    const remoteValue = document.querySelector('#remote-value');
    const eventLog = document.querySelector('#event-log');
    const labels = {
      personal: 'Personal',
      business: 'Business',
      enterprise: 'Enterprise',
    };

    proxy.addEventListener('focus', () => {
      document.body.classList.add('proxy-active');
      eventLog.textContent = `native proxy focused; remote state: ${proxy.value}`;
    });

    proxy.addEventListener('change', () => {
      // In LiveView this message would be forwarded to the remote select.
      remoteValue.textContent = labels[proxy.value];
      eventLog.textContent = `change forwarded to remote: ${proxy.value}`;
      document.body.classList.toggle('done', proxy.value === 'business');
    });
  </script>
</body>
</html>
