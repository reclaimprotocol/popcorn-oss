<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Native select picker</title><style>
*{box-sizing:border-box}body{margin:0;background:#eff6ff;color:#172554;font-family:system-ui,sans-serif}header{padding:18px;background:#172554;color:#fff;font-weight:900}main{padding:22px 16px}.ready{height:44px;background:#2b005f;color:#fff;display:grid;place-items:center;border-radius:12px;font-weight:900}.label{margin:34px 0 10px;font-weight:900}select{width:100%;height:66px;border:4px solid #1e3a8a;border-radius:14px;background:#fef3c7;padding:0 14px;font-size:21px}.focus{height:16px;margin-top:9px;background:#00cfff;border-radius:8px;visibility:hidden}.focused .focus{visibility:visible}.success{display:none;height:64px;margin-top:20px;background:#00d084;border-radius:14px;place-items:center;font-weight:950}.done .success{display:grid}
</style></head><body><header>NATIVE SELECT PICKER</header><main><div class="ready">READY</div><div class="label">Account type</div><select id="select"><option value="a">Personal</option><option value="b">Business</option><option value="c">Enterprise</option></select><div class="focus"></div><div class="success">BUSINESS SELECTED</div></main><script>
const select=document.querySelector('#select');select.onfocus=()=>document.body.classList.add('focused');select.onchange=()=>{if(select.value==='b')document.body.classList.add('done')};
</script></body></html>
