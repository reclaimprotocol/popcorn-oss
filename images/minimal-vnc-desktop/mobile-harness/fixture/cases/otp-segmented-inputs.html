<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OTP segmented inputs</title><style>
*{box-sizing:border-box}body{margin:0;background:#f0fdf4;color:#14532d;font-family:system-ui,sans-serif}header{padding:18px;background:#14532d;color:#fff;font-weight:900}main{padding:24px 16px;text-align:center}.ready{height:44px;background:#2b005f;color:#fff;display:grid;place-items:center;border-radius:12px;font-weight:900}.label{margin:38px 0 16px;font-weight:900}.otp{display:flex;justify-content:center;gap:10px}.otp input{width:65px;height:72px;border:4px solid #166534;border-radius:14px;background:#dcfce7;text-align:center;font-size:28px;font-weight:950}.otp input:focus{border-color:#ff00d8}.success{display:none;height:64px;margin-top:22px;background:#00d084;border-radius:14px;place-items:center;font-weight:950}.done .success{display:grid}
</style></head><body><header>OTP AUTO ADVANCE</header><main><div class="ready">READY</div><div class="label">Enter four digits</div><div class="otp"><input inputmode="numeric" maxlength="1"><input inputmode="numeric" maxlength="1"><input inputmode="numeric" maxlength="1"><input inputmode="numeric" maxlength="1"></div><div class="success">ALL FOUR CELLS FILLED</div></main><script>
const cells=[...document.querySelectorAll('.otp input')];cells.forEach((cell,i)=>cell.addEventListener('input',()=>{if(cell.value&&cells[i+1])cells[i+1].focus();if(cells.every(x=>x.value))document.body.classList.add('done')}));
</script></body></html>
