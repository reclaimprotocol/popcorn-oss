<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Native month picker</title><style>
*{box-sizing:border-box}body{margin:0;background:#f0fdf4;color:#14532d;font-family:system-ui,sans-serif}header{padding:18px;background:#14532d;color:#fff;font-weight:900}main{padding:20px 16px}.ready{height:42px;background:#2b005f;color:#fff;display:grid;place-items:center;border-radius:12px;font-weight:900}.label{margin:20px 0 7px;font-weight:900}input{width:100%;height:60px;border:4px solid #166534;border-radius:13px;background:#dcfce7;padding:0 12px;font-size:20px}.result{display:none;height:56px;margin-top:16px;border-radius:12px;place-items:center;font-weight:950}.success{display:grid;background:#00d084}.wrong{display:grid;background:#ff3b30;color:#fff}.hint{margin:18px 4px;line-height:1.4}
</style></head><body><header>NATIVE MONTH PICKER</header><main><div class="ready">READY</div><div class="label">Billing month</div><input id="picker" type="month" value="2026-08" min="2026-01" max="2026-12" step="1" aria-label="Billing month"><div id="result" class="result"></div><p class="hint">Open the platform month picker and choose September 2026.</p></main><script>
const input=document.querySelector('#picker'),result=document.querySelector('#result');input.addEventListener('change',()=>{const ok=input.value==='2026-09';result.className='result '+(ok?'success':'wrong');result.textContent=ok?'SEPTEMBER 2026 SELECTED':'WRONG: '+input.value});
</script></body></html>
