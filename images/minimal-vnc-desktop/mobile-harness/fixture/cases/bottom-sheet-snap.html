<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bottom sheet snap</title><style>
*{box-sizing:border-box}html,body{height:100%;overflow:hidden}body{margin:0;background:#dbeafe;color:#172554;font-family:system-ui,sans-serif}header{padding:18px;background:#172554;color:#fff;font-weight:900}.ready{height:44px;margin:22px 16px;background:#2b005f;color:#fff;display:grid;place-items:center;border-radius:12px;font-weight:900}.target{position:fixed;top:205px;left:calc(50% - 45px);width:90px;height:50px;border-radius:16px;background:#007aff}.sheet{position:fixed;left:0;right:0;bottom:0;height:430px;transform:translateY(280px);transition:transform .25s ease;border-radius:28px 28px 0 0;background:#fff;box-shadow:0 -10px 35px #17255433;touch-action:none}.sheet.open{transform:translateY(0)}.handle{width:100px;height:30px;margin:14px auto 10px;border-radius:15px;background:#e6007a}.content{padding:12px 24px;text-align:center;font-weight:850}.success{display:none;height:70px;margin-top:28px;background:#00d084;border-radius:15px;place-items:center;font-weight:950}.sheet.open .success{display:grid}
</style></head><body><header>BOTTOM SHEET SNAP</header><div class="ready">READY</div><i class="target"></i><section class="sheet" id="sheet"><div class="handle" id="handle"></div><div class="content">Drag the handle upward<div class="success">SHEET SNAPPED OPEN</div></div></section><script>
let y=0;const sheetHandle=document.querySelector('#handle'),bottomSheet=document.querySelector('#sheet');sheetHandle.addEventListener('touchstart',e=>y=e.touches[0].clientY,{passive:true});sheetHandle.addEventListener('touchend',e=>{if(e.changedTouches[0].clientY-y<-100)bottomSheet.classList.add('open')},{passive:true});
</script></body></html>
