<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Modal input workflow</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8fafc;color:#0f172a;font-family:system-ui,sans-serif}header{padding:18px;background:#0f172a;color:#fff;font-weight:900}main{padding:24px 16px;text-align:center}.ready{height:44px;background:#2b005f;color:#fff;display:grid;place-items:center;border-radius:12px;font-weight:900}.open{width:230px;height:90px;margin-top:70px;border:0;border-radius:18px;background:#7c3aed;color:#fff;font-size:20px;font-weight:950}.backdrop{display:none;position:fixed;inset:0;background:#0f172ab8;align-items:flex-start;justify-content:center;padding-top:120px}.shown{display:flex}.modal{width:calc(100% - 34px);padding:22px;border:5px solid #00cfff;border-radius:22px;background:#fff}.modal h2{margin:0 0 18px}input{width:100%;height:64px;border:4px solid #334155;border-radius:14px;background:#fef3c7;padding:0 14px;font-size:20px}.focused{height:18px;margin-top:10px;background:#ff00d8;border-radius:9px;visibility:hidden}.has-focus .focused{visibility:visible}.success{display:none;height:54px;margin-top:12px;background:#00d084;border-radius:12px;place-items:center;font-weight:950}.done .success{display:grid}
</style></head><body><header>MODAL INPUT</header><main><div class="ready">READY</div><button class="open" id="open">OPEN LOGIN MODAL</button></main><div class="backdrop" id="backdrop"><section class="modal"><h2>Sign in</h2><input id="field" placeholder="Type one character"><div class="focused"></div><div class="success">MODAL INPUT ACCEPTED TEXT</div></section></div><script>
const openButton=document.querySelector('#open'),modalBackdrop=document.querySelector('#backdrop'),modalField=document.querySelector('#field');openButton.onclick=()=>modalBackdrop.classList.add('shown');modalField.onfocus=()=>document.body.classList.add('has-focus');modalField.onblur=()=>document.body.classList.remove('has-focus');modalField.oninput=()=>{if(modalField.value.length)document.body.classList.add('done')};
</script></body></html>
