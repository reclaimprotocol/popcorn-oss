<!doctype html>
<html><head><meta charset="utf-8"><title>Dynamic viewport metadata</title>
<style>html,body{margin:0;background:#07111f;color:#eef6ff;font:18px/1.35 -apple-system,system-ui,sans-serif}.card{width:calc(100% - 24px);max-width:420px;margin:18px auto;padding:18px;border:3px solid #38bdf8;border-radius:18px;background:#10223b;box-sizing:border-box}.ready,.done{width:44px;height:44px;border-radius:8px}.ready{background:#334155}.done{background:#334155}h1{font-size:30px;margin:14px 0}.label{font-size:20px;font-weight:750;margin:10px 0}.copy{margin:10px 0;color:#cbd5e1}button{width:100%;height:62px;margin-top:12px;border:0;border-radius:12px;background:#00e5ff;color:#06213a;font:800 20px system-ui}</style></head>
<body><main class="card"><div id="ready" class="ready"></div><h1>Dynamic Viewport Metadata</h1><p class="label">Runtime metadata insertion laboratory</p><p class="copy">The mobile viewport is inserted after initial document creation.</p><p class="copy">LiveView must update its layout decision before evidence begins.</p><button id="act">Complete visible interaction</button><p id="state" class="label">Waiting for native tap</p><div id="done" class="done"></div></main>
<script>setTimeout(()=>{const meta=document.createElement('meta');meta.name='viewport';meta.content='initial-scale=1, maximum-scale=10';document.head.append(meta);ready.style.background='#00ff00'},1200);act.onclick=()=>{state.textContent='Interaction completed';done.style.background='#ff00ff'}</script></body></html>
