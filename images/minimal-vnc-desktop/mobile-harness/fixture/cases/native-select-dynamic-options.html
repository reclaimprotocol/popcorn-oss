<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Native select dynamic options</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#eff6ff;color:#172554;font-family:system-ui,sans-serif}
    header{padding:18px;background:#172554;color:#fff;font-weight:900}main{padding:18px 16px}
    .state{height:42px;background:#2b005f;color:#fff;display:grid;place-items:center;border-radius:12px;font-weight:900}
    .updated .state{background:#0057ff}.arm{width:100%;height:46px;margin-top:14px;border:0;border-radius:12px;background:#ff8a00;color:#111827;font-size:17px;font-weight:900}
    .label{margin:18px 0 8px;font-weight:900}select{width:100%;height:62px;border:4px solid #1e3a8a;border-radius:14px;background:#fef3c7;padding:0 14px;font-size:20px}
    .result{display:none;height:58px;margin-top:16px;border-radius:14px;place-items:center;font-weight:950}.done .success{display:grid;background:#00d084}.wrong .failure{display:grid;background:#ff3b30;color:#fff}
  </style>
</head>
<body>
  <header>DYNAMIC NATIVE SELECT</header>
  <main>
    <div class="state">READY</div>
    <button class="arm" id="arm">LOAD DATA WHILE PICKER IS OPEN</button>
    <div class="label">Account type</div>
    <select id="select" aria-label="Account type">
      <option value="p">Personal</option>
      <option value="b">Business</option>
      <option value="e">Enterprise</option>
    </select>
    <div class="result success">BUSINESS SELECTED</div>
    <div class="result failure" id="failure">WRONG OPTION SELECTED</div>
  </main>
  <script>
    const arm=document.querySelector('#arm');const select=document.querySelector('#select');const state=document.querySelector('.state');const failure=document.querySelector('#failure');
    arm.onclick=()=>{arm.disabled=true;arm.textContent='UPDATE ARMED';setTimeout(()=>{
      select.innerHTML='<option value="p">Personal</option><option value="t">Team</option><option value="b">Business</option><option value="e">Enterprise</option>';
      select.value='p';document.body.classList.add('updated');state.textContent='DATA UPDATED: BUSINESS MOVED';
    },2200)};
    select.onchange=()=>{document.body.classList.remove('done','wrong');if(select.value==='b'){document.body.classList.add('done')}else if(document.body.classList.contains('updated')){document.body.classList.add('wrong');failure.textContent='WRONG OPTION: '+select.options[select.selectedIndex].text.toUpperCase()}};
  </script>
</body>
</html>
