<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Reorder with autoscroll</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff7ed;color:#431407;font-family:system-ui,sans-serif}header{padding:18px;background:#431407;color:#fff;font-weight:900}main{padding:18px 16px}.ready{height:42px;background:#2b005f;color:#fff;display:grid;place-items:center;border-radius:12px;font-weight:900}.list{height:500px;margin-top:14px;overflow:auto;border:5px solid #9a3412;border-radius:18px;background:#fff;touch-action:none}.row{height:82px;padding:25px 16px;border-bottom:2px solid #fed7aa;font-weight:900}.dragging{background:#e6007a;color:#fff}.success{background:#00d084;color:#052e16;text-align:center}
</style></head><body><header>REORDER + AUTOSCROLL</header><main><div class="ready">READY</div><div class="list" id="list"><div class="row dragging" id="item">DRAG ITEM 1 DOWN</div><div class="row">Item 2</div><div class="row">Item 3</div><div class="row">Item 4</div><div class="row">Item 5</div><div class="row">Item 6</div><div class="row">Item 7</div><div class="row">Item 8</div><div class="row">Item 9</div></div></main><script>
const list=document.querySelector('#list'),item=document.querySelector('#item');let moved=false;item.addEventListener('touchmove',e=>{const y=e.touches[0].clientY,r=list.getBoundingClientRect();if(y>r.bottom-90){list.scrollTop+=55;moved=moved||list.scrollTop>80}},{passive:true});item.addEventListener('touchend',()=>{if(!moved)return;item.remove();item.className='row success';item.textContent='ITEM REORDERED AFTER AUTOSCROLL';list.append(item);list.scrollTop=list.scrollHeight},{passive:true});
</script></body></html>
