<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Fast repeated taps</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff7ed;color:#431407;font-family:system-ui,sans-serif}header{padding:18px;background:#431407;color:#fff;font-weight:900}main{padding:24px 16px;text-align:center}.ready{height:44px;background:#2b005f;color:#fff;display:grid;place-items:center;border-radius:12px;font-weight:900}button{width:210px;height:150px;margin:44px auto 18px;border:5px solid #831843;border-radius:26px;background:#e6007a;color:#fff;font-size:22px;font-weight:950;touch-action:manipulation}.count{font-size:28px;font-weight:950}.success{display:none;height:64px;margin-top:20px;background:#00d084;border-radius:14px;place-items:center;font-weight:950}.done .success{display:grid}
</style></head><body><header>FAST REPEATED TAPS</header><main><div class="ready">READY</div><button id="target">TAP × 8</button><div class="count" id="count">0 / 8</div><div class="success">ALL 8 TAPS RECEIVED</div></main><script>
let n=0;target.addEventListener('click',()=>{n++;count.textContent=n+' / 8';if(n===8)document.body.classList.add('done');if(n>8)document.body.classList.remove('done')});
</script></body></html>
