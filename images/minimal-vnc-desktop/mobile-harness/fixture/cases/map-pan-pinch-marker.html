<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Map pan pinch marker</title><style>
*{box-sizing:border-box}body{margin:0;background:#ecfeff;color:#164e63;font-family:system-ui,sans-serif}header{padding:18px;background:#164e63;color:#fff;font-weight:900}main{padding:18px 16px}.ready{height:42px;background:#2b005f;color:#fff;display:grid;place-items:center;border-radius:12px;font-weight:900}.map{position:relative;height:430px;margin-top:16px;overflow:hidden;border:5px solid #155e75;border-radius:20px;background:#8b5cf6;touch-action:none}.grid{position:absolute;inset:-100px;background:linear-gradient(#ffffff2b 2px,transparent 2px),linear-gradient(90deg,#ffffff2b 2px,transparent 2px);background-size:55px 55px}.anchor{position:absolute;top:230px;width:54px;height:54px;border-radius:50%}.start{right:35px;background:#ff2d55}.end{left:35px;background:#007aff}.zoom-proof,.pan-proof{display:none;position:absolute;top:15px;height:38px;border-radius:10px;color:#fff;font-weight:950;place-items:center}.zoom-proof{left:15px;width:120px;background:#00cfff}.pan-proof{right:15px;width:110px;background:#ff6b00}.zoomed .zoom-proof,.panned .pan-proof{display:grid}.marker{display:none;position:absolute;left:calc(50% - 38px);top:120px;width:76px;height:76px;border:5px solid #052e16;border-radius:50% 50% 50% 0;background:#00d084;transform:rotate(-45deg)}.marker span{display:block;transform:rotate(45deg);font-weight:950}.zoomed.panned .marker{display:grid;place-items:center}.success{display:none;height:60px;margin-top:14px;background:#b5ff00;border-radius:13px;place-items:center;font-weight:950}.done .success{display:grid}
</style></head><body><header>MAP: PINCH, PAN, TAP</header><main><div class="ready">READY</div><div class="map" id="map"><div class="grid"></div><i class="anchor end"></i><i class="anchor start"></i><div class="zoom-proof">ZOOMED</div><div class="pan-proof">PANNED</div><button class="marker" id="marker"><span>PIN</span></button></div><div class="success">MARKER TAP RECEIVED</div></main><script>
const map=document.querySelector('#map'),marker=document.querySelector('#marker');let initialDistance=0,startX=0;const distance=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY),markZoomed=()=>map.classList.add('zoomed');map.addEventListener('touchstart',e=>{if(e.touches.length===2)initialDistance=distance(e.touches);else startX=e.touches[0].clientX},{passive:true});map.addEventListener('touchmove',e=>{if(e.touches.length===2&&distance(e.touches)-initialDistance>45)markZoomed()},{passive:true});map.addEventListener('gesturechange',e=>{if(e.scale>1.25)markZoomed()},{passive:true});map.addEventListener('touchend',e=>{if(e.changedTouches.length===1&&startX-e.changedTouches[0].clientX>70)map.classList.add('panned')},{passive:true});marker.onclick=e=>{e.stopPropagation();document.body.classList.add('done')};
</script></body></html>
