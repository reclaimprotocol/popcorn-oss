<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sticky footer with keyboard</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f1f5f9;color:#0f172a;font-family:system-ui,sans-serif}header{padding:18px;background:#0f172a;color:#fff;font-weight:900}main{padding:22px 16px 130px}.ready{height:44px;background:#2b005f;color:#fff;display:grid;place-items:center;border-radius:12px;font-weight:900}.card{margin-top:24px;padding:20px;border-radius:18px;background:#fff}.card p{line-height:1.5}.label{margin-top:22px;font-weight:900}input{width:100%;height:64px;margin-top:8px;border:4px solid #334155;border-radius:14px;background:#e0f2fe;padding:0 14px;font-size:21px}.focus-proof{height:16px;margin-top:9px;background:#ff00d8;border-radius:8px;visibility:hidden}.focused .focus-proof{visibility:visible}.footer{position:fixed;z-index:5;left:0;right:0;bottom:0;padding:14px 16px max(14px,env(safe-area-inset-bottom));background:#ff6b00;color:#fff;text-align:center;font-weight:950}.success{display:none;position:fixed;z-index:20;top:140px;left:16px;right:16px;height:46px;background:#00d084;color:#052e16;border-radius:10px;place-items:center}.done .success{display:grid}
</style></head><body><header>STICKY FOOTER + KEYBOARD</header><main><div class="ready">READY</div><section class="card"><p>The fixed action bar must remain reachable while this field has native keyboard focus.</p><div class="label">Message</div><input id="field"><div class="focus-proof"></div></section></main><footer class="footer">FIXED ACTION BAR</footer><div class="success">INPUT RECEIVED; FOOTER POSITION RECORDED</div><script>
const field=document.querySelector('#field');field.onfocus=()=>document.body.classList.add('focused');field.oninput=()=>document.body.classList.add('done');setInterval(()=>{if(field.value)document.body.classList.add('done')},100);
</script></body></html>
