<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Drag to hidden target</title><style>
*{box-sizing:border-box}body{margin:0;min-height:1450px;background:#f8fafc;color:#172554;font-family:system-ui,sans-serif}header{padding:18px;background:#172554;color:#fff;font-weight:900}.ready{height:44px;margin:18px 16px;background:#2b005f;color:#fff;display:grid;place-items:center;border-radius:12px;font-weight:900}.source{width:220px;height:110px;margin:30px auto 0;border-radius:22px;background:#e6007a;color:#fff;display:grid;place-items:center;font-weight:950;touch-action:none}.space{height:610px;padding:30px;text-align:center;font-weight:800}.target{width:280px;height:150px;margin:0 auto;border:6px dashed #1d4ed8;border-radius:24px;background:#dbeafe;display:grid;place-items:center;font-weight:950}.success{background:#00d084;border-style:solid;color:#052e16}
</style></head><body><header>DRAG TO HIDDEN TARGET</header><div class="ready">READY</div><div class="source" id="source">DRAG DOWN</div><div class="space">The drop target starts below the viewport.</div><div class="target" id="target">HIDDEN DROP TARGET</div><script>
const source=document.querySelector('#source'),target=document.querySelector('#target');source.addEventListener('touchmove',e=>{if(e.touches[0].clientY>innerHeight-130)scrollBy(0,65)},{passive:true});source.addEventListener('touchend',()=>{const r=target.getBoundingClientRect();if(scrollY>250&&r.top<innerHeight){target.classList.add('success');target.textContent='DROP SUCCEEDED AFTER PAGE AUTOSCROLL'}},{passive:true});
</script></body></html>
