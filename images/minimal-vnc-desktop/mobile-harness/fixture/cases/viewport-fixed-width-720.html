<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=720"><title>Fixed viewport width</title>
<style>html,body{margin:0;background:#07111f;color:#eef6ff;font:18px/1.35 Arial,sans-serif}.card{width:680px;margin:20px auto;padding:24px;border:4px solid #38bdf8;border-radius:18px;background:#10223b;box-sizing:border-box}.ready,.done{width:60px;height:60px;border-radius:9px}.ready{background:#00ff00}.done{background:#334155}h1{font-size:44px;margin:18px 0}.label{font-size:30px;font-weight:700;margin:14px 0}.copy{font-size:23px;margin:12px 0;color:#cbd5e1}button{width:624px;height:88px;margin-top:16px;border:0;border-radius:12px;background:#00e5ff;color:#06213a;font:800 28px Arial}</style></head>
<body><main class="card"><div class="ready"></div><h1>Fixed Width Viewport</h1><p class="label">Seven hundred twenty pixel laboratory</p><p class="copy">Safari honors this explicit numeric viewport instead of substituting nine hundred eighty.</p><p class="copy">Visible text geometry detects the wrong fallback width.</p><button id="act">Complete visible interaction</button><p id="state" class="label">Waiting for native tap</p><div id="done" class="done"></div></main>
<script>act.onclick=()=>{state.textContent='Interaction completed';done.style.background='#ff00ff'}</script></body></html>
