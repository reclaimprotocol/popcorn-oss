<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Keyboard-open page scroll</title><style>
*{box-sizing:border-box}body{margin:0;min-height:1200px;background:#eff6ff;color:#172554;font-family:system-ui,sans-serif}header{padding:16px;background:#172554;color:#fff;font-weight:900}main{padding:18px 16px}.ready{height:42px;background:#2b005f;color:#fff;display:grid;place-items:center;border-radius:12px;font-weight:900}input{width:100%;height:58px;margin-top:18px;border:4px solid #1e3a8a;border-radius:13px;background:#fef3c7;padding:0 12px;font-size:20px}.focus{height:14px;margin-top:7px;background:#ff00d8;border-radius:7px;visibility:hidden}.focused .focus{visibility:visible}.scroll-area{height:700px;margin-top:18px;padding:24px;border-radius:18px;background:linear-gradient(#bfdbfe,#fff);font-weight:850}.success{display:none;position:sticky;top:8px;height:58px;background:#00d084;border-radius:13px;place-items:center;font-weight:950}.done .success{display:grid}
</style></head><body><header>SCROLL WITH KEYBOARD OPEN</header><main><div class="ready">READY</div><input id="field" placeholder="Focus me"><div class="focus"></div><div class="scroll-area"><div class="success">PAGE SCROLLED, FOCUS RETAINED</div>Swipe this content upward while the keyboard remains open.</div></main><script>
const field=document.querySelector('#field');let maximumY=0;field.onfocus=()=>document.body.classList.add('focused');window.addEventListener('scroll',()=>{maximumY=Math.max(maximumY,window.scrollY);if(maximumY>220&&window.scrollY<maximumY-70&&document.activeElement===field)document.body.classList.add('done')},{passive:true});
</script></body></html>
