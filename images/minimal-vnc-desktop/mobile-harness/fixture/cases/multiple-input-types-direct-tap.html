<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Multiple input types: direct field taps</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #172554; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 145vh; }
    body { overflow-x: hidden; background: #f8fafc; }
    header { position: fixed; z-index: 5; inset: 0 0 auto; min-height: 58px; padding: 10px 16px;
      background: #172554; color: white; font-weight: 900; letter-spacing: .035em; }
    #status { display: block; margin-top: 3px; color: #bfdbfe; font-size: 11px; letter-spacing: 0; }
    .top-line { position: fixed; z-index: 2; top: 72px; left: 10px; right: 10px; height: 5px;
      border-radius: 4px; background: #f97316; }
    main { min-height: 145vh; padding: 96px 14px 120px; }
    .instructions { margin: 0 auto; max-width: 560px; color: #334155; font-size: 13px;
      font-weight: 700; line-height: 1.35; }
    .card { position: absolute; z-index: 3; top: calc(100vh - 610px); left: 14px; right: 14px;
      min-height: 354px; padding: 16px 14px 15px; border: 4px solid #2563eb; border-radius: 18px;
      background: white; box-shadow: 0 18px 50px rgb(30 64 175 / .22); }
    .card::before, .card::after { content: ""; position: absolute; left: 12px; right: 12px;
      height: 5px; border-radius: 4px; background: #fb923c; }
    .card::before { top: 7px; }
    .card::after { bottom: 7px; background: #22c55e; }
    #phase { position: absolute; z-index: 4; top: 11px; right: 11px; width: 38px; height: 38px;
      display: grid; place-items: center; border: 3px solid white; border-radius: 8px; color: white;
      font: 900 11px/1 ui-monospace, monospace; background: #2b005f; }
    #phase[data-phase="text-focus"] { background: #ff00d8; }
    #phase[data-phase="text-value"] { background: #ffe600; color: #111827; }
    #phase[data-phase="email-focus"] { background: #00cfff; color: #111827; }
    #phase[data-phase="email-value"] { background: #00ff70; color: #111827; }
    #phase[data-phase="tel-focus"] { background: #ff5a00; }
    #phase[data-phase="tel-value"] { background: #b5ff00; color: #111827; }
    h1 { margin: 3px 52px 8px 0; font-size: 15px; }
    .field { position: relative; margin-top: 8px; padding-right: 34px; }
    label { display: block; margin-bottom: 3px; font-size: 11px; font-weight: 900; }
    input { width: 100%; height: 52px; border: 3px solid #64748b; border-radius: 11px; padding: 0 11px;
      background: white; font: 750 18px/1 system-ui, sans-serif; }
    input:focus { outline: 4px solid #f59e0b; border-color: #b45309; }
    .target { position: absolute; right: 0; bottom: 10px; width: 26px; height: 26px;
      border: 2px solid white; border-radius: 6px; box-shadow: 0 0 0 2px #334155; pointer-events: none; }
    .text-target { background: #64006f; }
    .email-target { background: #007f91; }
    .tel-target { background: #743800; }
    .text-target[data-state="focus"] { background: #ff00d8; }
    .text-target[data-state="value"] { background: #ffe600; }
    .email-target[data-state="focus"] { background: #00cfff; }
    .email-target[data-state="value"] { background: #00ff70; }
    .tel-target[data-state="focus"] { background: #ff5a00; }
    .tel-target[data-state="value"] { background: #b5ff00; }
    #echo { margin: 8px 0 0; color: #166534; font-size: 11px; font-weight: 900; }
  </style>
</head>
<body>
  <header>MULTI-INPUT DIRECT TAPS <span id="status">READY: TAP TEXT → TAP EMAIL → TAP TELEPHONE</span></header>
  <div class="top-line" aria-hidden="true"></div>
  <main>
    <p class="instructions">Type once in Text, then tap the Email field directly and type, then tap Telephone directly and type. Do not use the iOS previous/next arrows.</p>
    <section class="card">
      <div id="phase" data-phase="ready" aria-label="visible phase marker">R</div>
      <h1>THREE DIRECTLY TAPPED INPUT TYPES</h1>
      <div class="field">
        <label for="text-input">1 · TEXT</label>
        <input id="text-input" type="text" inputmode="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="text value">
        <span class="target text-target" aria-hidden="true"></span>
      </div>
      <div class="field">
        <label for="email-input">2 · EMAIL</label>
        <input id="email-input" type="email" inputmode="email" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="email value">
        <span class="target email-target" aria-hidden="true"></span>
      </div>
      <div class="field">
        <label for="tel-input">3 · TELEPHONE</label>
        <input id="tel-input" type="tel" inputmode="tel" autocomplete="off" placeholder="telephone value">
        <span class="target tel-target" aria-hidden="true"></span>
      </div>
      <p id="echo">VALUES: TEXT 0 · EMAIL 0 · TEL 0</p>
    </section>
  </main>
  <script>
    const phase = document.querySelector('#phase');
    const status = document.querySelector('#status');
    const echo = document.querySelector('#echo');
    const fields = {
      text: document.querySelector('#text-input'),
      email: document.querySelector('#email-input'),
      tel: document.querySelector('#tel-input'),
    };
    const labels = { text: 'TEXT', email: 'EMAIL', tel: 'TELEPHONE' };
    const targets = {
      text: document.querySelector('.text-target'),
      email: document.querySelector('.email-target'),
      tel: document.querySelector('.tel-target'),
    };
    function render() {
      echo.textContent = `VALUES: TEXT ${fields.text.value.length} · EMAIL ${fields.email.value.length} · TEL ${fields.tel.value.length}`;
    }
    function setPhase(kind) {
      const hasValue = fields[kind].value.length > 0;
      targets[kind].dataset.state = hasValue ? 'value' : 'focus';
      phase.dataset.phase = `${kind}-${hasValue ? 'value' : 'focus'}`;
      phase.textContent = hasValue ? `${labels[kind][0]}1` : `${labels[kind][0]}F`;
      status.textContent = `${labels[kind]} ${hasValue ? 'RECEIVED INPUT' : 'FOCUSED BY DIRECT TAP'}`;
    }
    Object.entries(fields).forEach(([kind, input]) => {
      input.addEventListener('focus', () => setPhase(kind));
      input.addEventListener('input', () => { setPhase(kind); render(); });
    });
  </script>
</body>
</html>
