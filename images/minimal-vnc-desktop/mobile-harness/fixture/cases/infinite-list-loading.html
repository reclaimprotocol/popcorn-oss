<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Infinite list loading</title><style>
*{box-sizing:border-box}body{margin:0;background:#ecfeff;color:#164e63;font-family:system-ui,sans-serif}header{padding:18px;background:#164e63;color:#fff;font-weight:900}main{padding:20px 16px}.ready{height:44px;background:#2b005f;color:#fff;display:grid;place-items:center;border-radius:12px;font-weight:900}.list{height:430px;margin-top:18px;overflow-y:auto;border:5px solid #0e7490;border-radius:18px;background:#fff;-webkit-overflow-scrolling:touch}.row{height:78px;padding:26px 18px;border-bottom:2px solid #cffafe;font-weight:850}.success{height:84px;background:#00d084;color:#052e16;font-weight:950;display:grid;place-items:center}
</style></head><body><header>INFINITE LIST</header><main><div class="ready">READY</div><div class="list" id="list"><div class="row">Existing item 1</div><div class="row">Existing item 2</div><div class="row">Existing item 3</div><div class="row">Existing item 4</div><div class="row">Existing item 5</div><div class="row">Existing item 6</div><div class="row">Existing item 7</div><div class="row">Existing item 8</div><div class="row">Existing item 9</div><div class="row">Existing item 10</div><div class="row">Existing item 11</div><div class="row">Existing item 12</div><div class="row">Existing item 13</div><div class="row">Existing item 14</div><div id="sentinel" class="row">Loading boundary</div></div></main><script>
const list=document.querySelector('#list');let loaded=false;list.addEventListener('scroll',()=>{if(loaded||list.scrollTop+list.clientHeight<list.scrollHeight-30)return;loaded=true;const result=document.createElement('div');result.className='success';result.textContent='NEW ITEMS LOADED';list.append(result)},{passive:true});
</script></body></html>
