<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Native date picker</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f0fdf4;color:#14532d;font-family:system-ui,sans-serif}
    header{padding:18px;background:#14532d;color:#fff;font-weight:900}main{padding:20px 16px}
    .ready{height:42px;background:#2b005f;color:#fff;display:grid;place-items:center;border-radius:12px;font-weight:900}
    .label{margin:20px 0 7px;font-weight:900}input{width:100%;height:64px;border:4px solid #166534;border-radius:13px;background:#dcfce7;padding:0 12px;font-size:20px}
    .result{display:none;height:58px;margin-top:16px;border-radius:13px;place-items:center;font-weight:950}.done .success{display:grid;background:#00d084}.wrong .failure{display:grid;background:#ff3b30;color:#fff}
    .hint{margin:16px 4px 0;line-height:1.4;color:#365314}
  </style>
</head>
<body>
  <header>NATIVE DATE PICKER</header>
  <main>
    <div class="ready">READY</div>
    <div class="label">Travel date</div>
    <input id="date" type="date" aria-label="Travel date" value="2026-08-21" min="2026-08-01" max="2026-08-31" step="1">
    <div class="result success">AUGUST 29 SELECTED</div>
    <div class="result failure" id="failure">WRONG DATE</div>
    <p class="hint">Open the platform calendar, choose August 29, then confirm.</p>
  </main>
  <script>
    const date=document.querySelector('#date');const failure=document.querySelector('#failure');
    date.addEventListener('change',()=>{document.body.classList.remove('done','wrong');if(date.value==='2026-08-29'){document.body.classList.add('done')}else{document.body.classList.add('wrong');failure.textContent='WRONG DATE: '+date.value}});
  </script>
</body>
</html>
