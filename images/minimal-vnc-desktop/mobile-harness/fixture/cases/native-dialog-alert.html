<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Blocking alert acknowledgement</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 24px; font: 17px/1.4 system-ui, sans-serif; background: #eef2ff; color: #172554; }
    #phase { position: fixed; top: 12px; right: 12px; width: 52px; height: 52px; border: 4px solid white;
      border-radius: 10px; background: #2b005f; box-shadow: 0 4px 18px #0003; }
    #phase.after { background: #00ff6a; }
    main { width: min(100%, 520px); margin: 90px auto 0; padding: 24px; border: 4px solid #f97316;
      border-radius: 18px; background: white; }
    button { min-width: 48px; min-height: 48px; font: inherit; background: #e6007a; color: white;
      border: 0; border-radius: 12px; padding: 14px 22px; }
  </style>
</head>
<body>
  <div id="phase" aria-label="visible synchronization marker"></div>
  <main>
    <h1>Blocking alert</h1>
    <p>Tapping the button opens a modal alert. The page is blocked until it is
      acknowledged, so the marker can only turn green AFTER the dialog is answered.</p>
    <button id="target" type="button">Show alert</button>
    <p id="result">Before</p>
  </main>
  <script>
    const phase = document.querySelector('#phase');
    const result = document.querySelector('#result');
    document.querySelector('#target').addEventListener('click', () => {
      // alert() BLOCKS: nothing below this line runs until the dialog is answered,
      // which is exactly what makes the marker a proof of acknowledgement rather
      // than a proof that a dialog was requested.
      window.alert('Acknowledge to continue.');
      phase.classList.add('after');
      result.textContent = 'Acknowledged';
    });
  </script>
</body>
</html>
