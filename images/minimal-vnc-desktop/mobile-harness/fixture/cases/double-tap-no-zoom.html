<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=3,viewport-fit=cover"><title>Double tap without zoom</title><style>
*{box-sizing:border-box}body{margin:0;background:#f0fdfa;color:#134e4a;font-family:system-ui,sans-serif}header{padding:18px;background:#134e4a;color:#fff;font-weight:900}main{padding:24px 16px;text-align:center}.ready{height:44px;background:#2b005f;color:#fff;display:grid;place-items:center;border-radius:12px;font-weight:900}button{width:230px;height:170px;margin:46px auto 20px;border:5px solid #4c1d95;border-radius:24px;background:#8b5cf6;color:#fff;font-size:22px;font-weight:950;touch-action:manipulation}.status{height:64px;display:grid;place-items:center;border-radius:14px;background:#cbd5e1;font-weight:950}.success{background:#00d084}.failure{background:#dc2626;color:#fff}
</style></head><body><header>DOUBLE TAP</header><main><div class="ready">READY</div><button id="target">DOUBLE TAP</button><div class="status" id="status">WAITING</div></main><script>
let n=0,timer;const button=document.getElementById('target');function evaluate(){const scale=visualViewport?.scale||1;status.textContent=n>=2&&scale<1.08?'NATIVE DOUBLE TAP, SCALE STABLE':'FAILED: '+n+' TAPS, '+scale.toFixed(2)+'×';status.className='status '+(n>=2&&scale<1.08?'success':'failure')}button.addEventListener('click',()=>{n++;clearTimeout(timer);timer=setTimeout(evaluate,900)});button.addEventListener('dblclick',()=>{n=Math.max(n,2);clearTimeout(timer);timer=setTimeout(evaluate,900)});visualViewport?.addEventListener('resize',()=>{if((visualViewport.scale||1)>=1.08)evaluate()});
</script></body></html>
