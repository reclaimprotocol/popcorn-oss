<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Password reveal focus</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff7ed;color:#431407;font-family:system-ui,sans-serif}header{padding:18px;background:#431407;color:#fff;font-weight:900}main{padding:24px 16px}.ready{height:44px;background:#2b005f;color:#fff;display:grid;place-items:center;border-radius:12px;font-weight:900}.label{margin:30px 0 10px;font-weight:900}.row{display:flex;gap:8px}input{min-width:0;flex:1;height:64px;border:4px solid #9a3412;border-radius:14px;background:#ffedd5;padding:0 14px;font-size:21px}.reveal{width:92px;border:0;border-radius:14px;background:#ff6b00;color:#fff;font-weight:950}.typed{height:16px;margin-top:10px;background:#ffe600;border-radius:8px;visibility:hidden}.has-text .typed{visibility:visible}.success{display:none;height:62px;margin-top:18px;background:#00d084;border-radius:14px;place-items:center;font-weight:950}.done .success{display:grid}
</style></head><body><header>PASSWORD REVEAL</header><main><div class="ready">READY</div><div class="label">Password</div><div class="row"><input id="password" type="password" autocomplete="off"><button id="reveal" class="reveal">SHOW</button></div><div class="typed"></div><div class="success">REVEALED, INPUT STILL FOCUSED</div></main><script>
const passwordField=document.querySelector('#password'),revealButton=document.querySelector('#reveal');passwordField.oninput=()=>document.body.classList.toggle('has-text',!!passwordField.value);revealButton.addEventListener('pointerdown',e=>e.preventDefault());revealButton.onclick=e=>{e.preventDefault();passwordField.type=passwordField.type==='password'?'text':'password';if(passwordField.value&&document.activeElement===passwordField)document.body.classList.add('done')};
</script></body></html>
