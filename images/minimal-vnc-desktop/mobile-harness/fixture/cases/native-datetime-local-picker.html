<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Native local date-time picker</title><style>
*{box-sizing:border-box}body{margin:0;background:#f0fdf4;color:#14532d;font-family:system-ui,sans-serif}header{padding:18px;background:#14532d;color:#fff;font-weight:900}main{padding:20px 16px}.ready{height:42px;background:#2b005f;color:#fff;display:grid;place-items:center;border-radius:12px;font-weight:900}.label{margin:20px 0 7px;font-weight:900}input{width:100%;height:60px;border:4px solid #166534;border-radius:13px;background:#dcfce7;padding:0 12px;font-size:18px}.result{display:none;height:56px;margin-top:16px;border-radius:12px;place-items:center;font-weight:950}.success{display:grid;background:#00d084}.wrong{display:grid;background:#ff3b30;color:#fff}.hint{margin:18px 4px;line-height:1.4}
</style></head><body><header>NATIVE DATE + TIME</header><main><div class="ready">READY</div><div class="label">Local appointment</div><input id="picker" type="datetime-local" value="2026-08-23T10:15" min="2026-08-20T09:00" max="2026-08-30T17:00" step="60" aria-label="Local appointment"><div id="result" class="result"></div><p class="hint">Choose August 29 at 11:16 using the platform control.</p></main><script>
const input=document.querySelector('#picker'),result=document.querySelector('#result');input.addEventListener('change',()=>{if(input.value!=='2026-08-29T11:16'){result.className='result';result.textContent='';return}result.className='result success';result.textContent='AUG 29 AT 11:16 SELECTED'});
</script></body></html>
