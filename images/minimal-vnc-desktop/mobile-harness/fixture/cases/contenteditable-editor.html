<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Contenteditable editor</title><style>
*{box-sizing:border-box}body{margin:0;background:#fdf4ff;color:#4a044e;font-family:system-ui,sans-serif}header{padding:18px;background:#4a044e;color:#fff;font-weight:900}main{padding:24px 16px}.ready{height:44px;background:#2b005f;color:#fff;display:grid;place-items:center;border-radius:12px;font-weight:900}.label{margin:28px 0 10px;font-weight:900}.editor{min-height:150px;padding:18px;border:5px solid #86198f;border-radius:18px;background:#fae8ff;font-size:21px;outline:none}.editor:focus{border-color:#ff00d8}.focus-proof{height:18px;margin-top:12px;border-radius:9px;background:#ff00d8;visibility:hidden}.focused .focus-proof{visibility:visible}.success{display:none;height:62px;margin-top:18px;background:#00d084;border-radius:14px;place-items:center;font-weight:950}.done .success{display:grid}
</style></head><body><header>CONTENTEDITABLE</header><main><div class="ready">READY</div><div class="label">Rich-text surface</div><div id="editor" class="editor" contenteditable="true" role="textbox" aria-label="Editor">Tap here: </div><div class="focus-proof"></div><div class="success">EDITOR RECEIVED INPUT</div></main><script>
const editable=document.querySelector('#editor');editable.onfocus=()=>document.body.classList.add('focused');editable.onblur=()=>document.body.classList.remove('focused');editable.oninput=()=>document.body.classList.add('done');
</script></body></html>
