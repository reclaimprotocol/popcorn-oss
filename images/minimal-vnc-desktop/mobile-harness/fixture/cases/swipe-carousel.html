<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Swipe carousel</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef2ff;color:#172554;font-family:system-ui,sans-serif}header{padding:18px;background:#172554;color:#fff;font-weight:900}main{padding:24px 16px}.ready{height:44px;background:#2b005f;color:#fff;display:grid;place-items:center;border-radius:12px;font-weight:900}.frame{margin-top:28px;overflow:hidden;border:5px solid #172554;border-radius:22px;background:#fff;touch-action:pan-y}.track{display:flex;width:300%;transform:translateX(0);transition:transform .25s ease}.slide{width:33.333%;height:280px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}.slide:nth-child(2){background:#d1fae5}.anchors{width:80%;display:flex;justify-content:space-between}.anchor{width:58px;height:58px;border-radius:50%}.start{background:#ff2d55}.end{background:#007aff}.success{display:none;width:80%;height:70px;background:#00d084;border-radius:15px;place-items:center;color:#052e16;font-weight:950}.done .track{transform:translateX(-33.333%)}.done .success{display:grid}.hint{text-align:center;font-weight:800}
</style></head><body><header>SWIPE CAROUSEL</header><main><div class="ready">READY</div><div class="frame" id="frame"><div class="track"><section class="slide"><strong>Slide one</strong><div class="anchors"><i class="anchor end"></i><i class="anchor start"></i></div><div class="hint">Swipe red toward blue</div></section><section class="slide"><div class="success">SLIDE TWO ACTIVE</div></section><section class="slide">Slide three</section></div></div></main><script>
let x=0;frame.addEventListener('touchstart',e=>x=e.touches[0].clientX,{passive:true});frame.addEventListener('touchend',e=>{if(e.changedTouches[0].clientX-x<-70)document.body.classList.add('done')},{passive:true});
</script></body></html>
