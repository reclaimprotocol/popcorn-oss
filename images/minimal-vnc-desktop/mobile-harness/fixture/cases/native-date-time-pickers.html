<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Date and time pickers</title><style>
*{box-sizing:border-box}body{margin:0;background:#f0fdf4;color:#14532d;font-family:system-ui,sans-serif}header{padding:18px;background:#14532d;color:#fff;font-weight:900}main{padding:20px 16px}.ready{height:42px;background:#2b005f;color:#fff;display:grid;place-items:center;border-radius:12px;font-weight:900}.label{margin:20px 0 7px;font-weight:900}input{width:100%;height:60px;border:4px solid #166534;border-radius:13px;background:#dcfce7;padding:0 12px;font-size:20px}.date-proof,.success{display:none;height:52px;margin-top:12px;border-radius:12px;place-items:center;font-weight:950}.date-proof{background:#ffe600}.success{background:#00d084}.date-set .date-proof,.done .success{display:grid}
</style></head><body><header>NATIVE DATE + TIME</header><main><div class="ready">READY</div><div class="label">Date</div><input id="date" type="date" value="2026-08-21"><div class="date-proof">DATE CHANGED</div><div class="label">Time</div><input id="time" type="time" value="10:00"><div class="success">DATE AND TIME CHANGED</div></main><script>
const date=document.querySelector('#date'),time=document.querySelector('#time');date.onchange=()=>document.body.classList.add('date-set');time.onchange=()=>{if(document.body.classList.contains('date-set'))document.body.classList.add('done')};
</script></body></html>
