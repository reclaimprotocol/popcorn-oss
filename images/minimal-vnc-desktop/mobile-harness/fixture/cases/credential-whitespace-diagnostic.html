<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Credential whitespace diagnostic</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:#e6edf7;font:14px/1.45 system-ui,sans-serif}
header{padding:10px 12px;background:#172554;font-weight:800}
main{padding:12px}
label{display:block;margin:10px 0 4px;font-weight:700;font-size:13px}
input{width:100%;height:46px;border:2px solid #1e3a8a;border-radius:10px;background:#f8fafc;color:#0b1020;padding:0 10px;font-size:17px}
.row{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
button{height:34px;padding:0 12px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#e6edf7;font-weight:700}
.val{margin-top:8px;padding:8px;border-radius:8px;background:#0f172a;border:1px solid #1e293b;font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all}
.val b{color:#7dd3fc}
.ws{color:#f472b6;font-weight:800}
#log{margin-top:12px;height:300px;overflow:auto;background:#0f172a;border:1px solid #1e293b;border-radius:8px;padding:8px;font-family:ui-monospace,Menlo,monospace;font-size:11px;white-space:pre;line-height:1.35}
#log div.ws{color:#f472b6}
.hint{color:#94a3b8;font-size:12px;margin-top:6px}
</style>
</head>
<body>
<header>CREDENTIAL WHITESPACE DIAGNOSTIC — use fake credentials only</header>
<main>
  <label for="username">Username (type=text, autocomplete=username)</label>
  <input id="username" name="username" type="text" autocomplete="username" placeholder="username">
  <div class="val" id="v-username">—</div>

  <label for="email">Email (type=email)</label>
  <input id="email" name="email" type="email" autocomplete="email" placeholder="email">
  <div class="val" id="v-email">—</div>

  <label for="password">Password (type=password)</label>
  <input id="password" name="password" type="password" autocomplete="current-password" placeholder="password">
  <div class="val" id="v-password">—</div>

  <label for="otp">One-time code (inputmode=numeric, autocomplete=one-time-code)</label>
  <input id="otp" name="otp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456">
  <div class="val" id="v-otp">—</div>

  <label for="plainpass">Password control (type=text, name=password)</label>
  <input id="plainpass" name="password_plain" type="text" autocomplete="off" placeholder="same chars, visible field">
  <div class="val" id="v-plainpass">—</div>

  <div class="row">
    <button id="clear">Clear fields</button>
    <button id="clearlog">Clear log</button>
    <button id="copy">Copy log</button>
    <button id="mask">Mask: ON</button>
  </div>
  <div class="hint">
    Masking replaces letters with <code>a</code> and digits with <code>9</code> everywhere,
    so no real secret can reach the log. Whitespace, punctuation and symbols are always shown
    verbatim as code points — those are the characters under investigation.
  </div>
  <div id="log"></div>
</main>
<script>
'use strict';
var t0 = Date.now();
var masking = true;
var logEl = document.getElementById('log');
var fields = ['username', 'email', 'password', 'otp', 'plainpass'];

// Whitespace and invisible characters the investigation cares about. Anything in
// here is ALWAYS reported verbatim, masked or not.
var INTERESTING = {
  0x0020: 'SP', 0x00a0: 'NBSP', 0x2000: 'ENQUAD', 0x2001: 'EMQUAD', 0x2002: 'ENSP',
  0x2003: 'EMSP', 0x2004: '3/MSP', 0x2005: '4/MSP', 0x2006: '6/MSP', 0x2007: 'FIGSP',
  0x2008: 'PUNCSP', 0x2009: 'THINSP', 0x200a: 'HAIRSP', 0x202f: 'NNBSP', 0x205f: 'MMSP',
  0x3000: 'IDSP', 0x1680: 'OGHAMSP', 0x200b: 'ZWSP', 0x200c: 'ZWNJ', 0x200d: 'ZWJ',
  0xfeff: 'BOM', 0x0009: 'TAB', 0x000a: 'LF', 0x000d: 'CR', 0x00ad: 'SHY'
};

function isMaskable(cp) {
  if (INTERESTING[cp] !== undefined) return false;
  var ch = String.fromCodePoint(cp);
  return /[\p{L}\p{N}]/u.test(ch);
}

// One code point -> a display token. Letters/digits collapse under masking; every
// whitespace or invisible character keeps its identity.
function token(cp) {
  var name = INTERESTING[cp];
  if (name) return '<' + name + ' U+' + cp.toString(16).toUpperCase().padStart(4, '0') + '>';
  if (masking && isMaskable(cp)) {
    var ch = String.fromCodePoint(cp);
    return /\p{N}/u.test(ch) ? '9' : 'a';
  }
  return String.fromCodePoint(cp);
}

function describe(value) {
  var out = '', cps = [];
  for (var ch of String(value == null ? '' : value)) {
    var cp = ch.codePointAt(0);
    out += token(cp);
    cps.push('U+' + cp.toString(16).toUpperCase().padStart(4, '0'));
  }
  return { escaped: out, points: cps };
}

function hasUnexpectedWhitespace(value) {
  return /[\s ​‌‍﻿  ]/.test(String(value || ''));
}

function renderValue(id) {
  var el = document.getElementById(id);
  var box = document.getElementById('v-' + id);
  var d = describe(el.value);
  var ws = hasUnexpectedWhitespace(el.value);
  box.innerHTML = '<b>len</b> ' + Array.from(el.value).length +
    ' <b>value</b> ' + escapeHtml(d.escaped) +
    (ws ? ' <span class="ws">WHITESPACE PRESENT</span>' : '') +
    '<br><b>cps</b> ' + d.points.join(' ');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>]/g, function (c) {
    return c === '&' ? '&amp;' : c === '<' ? '&lt;' : '&gt;';
  });
}

function sel(el) {
  try { return el.selectionStart + '-' + el.selectionEnd; } catch (_) { return 'n/a'; }
}

function log(el, e) {
  var d = describe(el.value);
  var data = e.data == null ? '-' : describe(e.data).escaped;
  var line = String(Date.now() - t0).padStart(6, ' ') + 'ms ' +
    el.id.padEnd(9, ' ') + ' ' + String(e.type).padEnd(18, ' ') +
    ' it=' + (e.inputType || '-') +
    ' data=' + JSON.stringify(data) +
    ' comp=' + (e.isComposing === true ? 1 : 0) +
    ' key=' + (e.key !== undefined ? JSON.stringify(e.key) : '-') +
    ' code=' + (e.code || '-') +
    ' sel=' + sel(el) +
    ' len=' + Array.from(el.value).length +
    ' val=' + JSON.stringify(d.escaped);
  var div = document.createElement('div');
  if (hasUnexpectedWhitespace(el.value) || (e.data && hasUnexpectedWhitespace(e.data))) div.className = 'ws';
  div.textContent = line;
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
  renderValue(el.id);
}

var EVENTS = ['keydown', 'keypress', 'keyup', 'beforeinput', 'input',
  'compositionstart', 'compositionupdate', 'compositionend',
  'focus', 'blur', 'select', 'paste'];

fields.forEach(function (id) {
  var el = document.getElementById(id);
  EVENTS.forEach(function (type) {
    el.addEventListener(type, function (e) { log(el, e); }, true);
  });
  renderValue(id);
});

document.getElementById('clear').onclick = function () {
  fields.forEach(function (id) { document.getElementById(id).value = ''; renderValue(id); });
};
document.getElementById('clearlog').onclick = function () { logEl.textContent = ''; };
document.getElementById('copy').onclick = function () {
  try { navigator.clipboard.writeText(logEl.innerText); } catch (_) {}
};
document.getElementById('mask').onclick = function () {
  masking = !masking;
  this.textContent = 'Mask: ' + (masking ? 'ON' : 'OFF');
  fields.forEach(renderValue);
};

// Machine-readable dump for a harness or a CDP probe: window.__wsDiag()
window.__wsDiag = function () {
  var out = {};
  fields.forEach(function (id) {
    var el = document.getElementById(id);
    out[id] = {
      length: Array.from(el.value).length,
      codePoints: Array.from(el.value).map(function (ch) { return ch.codePointAt(0); }),
      hasWhitespace: hasUnexpectedWhitespace(el.value)
    };
  });
  return out;
};
</script>
</body>
</html>
