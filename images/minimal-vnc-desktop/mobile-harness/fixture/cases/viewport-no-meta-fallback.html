<!doctype html>
<html><head><meta charset="utf-8"><title>No viewport fallback</title>
<style>html,body{margin:0;background:#07111f;color:#eef6ff;font:18px/1.35 Arial,sans-serif}.card{width:900px;margin:22px auto;padding:28px;border:5px solid #38bdf8;border-radius:20px;background:#10223b;box-sizing:border-box}.ready,.done{width:70px;height:70px;border-radius:10px}.ready{background:#00ff00}.done{background:#334155}h1{font-size:52px;margin:20px 0}.label{font-size:34px;font-weight:700;margin:16px 0}.copy{font-size:26px;margin:14px 0;color:#cbd5e1}button{width:820px;height:100px;margin-top:18px;border:0;border-radius:14px;background:#00e5ff;color:#06213a;font:800 32px Arial}</style></head>
<body><main class="card"><div class="ready"></div><h1>Legacy Desktop Viewport</h1><p class="label">Nine hundred pixel content laboratory</p><p class="copy">A page without viewport metadata should use Safari's desktop fallback width.</p><p class="copy">LiveView must scale this desktop layout instead of reflowing it.</p><button id="act">Complete visible interaction</button><p id="state" class="label">Waiting for native tap</p><div id="done" class="done"></div></main>
<script>act.onclick=()=>{state.textContent='Interaction completed';done.style.background='#ff00ff'}</script></body></html>
