<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Field switch after scroll</title><style>
*{box-sizing:border-box}body{margin:0;min-height:1250px;background:#f8fafc;color:#172554;font-family:system-ui,sans-serif}header{padding:18px;background:#172554;color:#fff;font-weight:900}.ready{height:44px;margin:20px 16px;background:#2b005f;color:#fff;display:grid;place-items:center;border-radius:12px;font-weight:900}.spacer{height:450px;padding:30px 20px;font-weight:850;background:linear-gradient(#dbeafe,#f8fafc)}.form{margin:0 16px;padding:14px;border:4px solid #1e3a8a;border-radius:20px;background:#fff}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.label{margin:4px 0 6px;font-weight:900}input{width:100%;height:54px;border:4px solid #334155;border-radius:13px;padding:0 10px;font-size:20px}.first{background:#fef3c7}.second{background:#e0f2fe}.focus-one,.focus-two{height:10px;margin-top:5px;border-radius:7px;visibility:hidden}.focus-one{background:#ff00d8}.focus-two{background:#00cfff}.one .focus-one,.two .focus-two{visibility:visible}.typed{height:10px;margin-top:5px;background:#ffe600;border-radius:7px;visibility:hidden}.has-text .typed{visibility:visible}.success{display:none;height:54px;margin-top:12px;background:#00d084;border-radius:13px;place-items:center;font-weight:950;text-align:center}.done .success{display:grid}
</style></head><body><header>SWITCH AFTER PAGE SCROLL</header><div class="ready">READY</div><div class="spacer">Swipe the page upward to reach the form.</div><section class="form"><div class="fields"><div><div class="label">First field</div><input id="first" class="first"><div class="focus-one"></div><div class="typed"></div></div><div><div class="label">Second field</div><input id="second" class="second"><div class="focus-two"></div></div></div><div class="success">SECOND FIELD FOCUSED AFTER SCROLL</div></section><script>
const first=document.querySelector('#first'),second=document.querySelector('#second');first.onfocus=()=>{document.body.classList.add('one');document.body.classList.remove('two')};first.oninput=()=>document.body.classList.add('has-text');second.onfocus=()=>{document.body.classList.remove('one');document.body.classList.add('two');if(first.value)document.body.classList.add('done')};
</script></body></html>
