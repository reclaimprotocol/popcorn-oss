<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Slider scrubbing</title><style>
*{box-sizing:border-box}body{margin:0;background:#eff6ff;color:#172554;font-family:system-ui,sans-serif}header{padding:18px;background:#172554;color:#fff;font-weight:900}main{padding:24px 16px}.ready{height:44px;background:#2b005f;color:#fff;display:grid;place-items:center;border-radius:12px;font-weight:900}.card{margin-top:42px;padding:24px 16px;border:4px solid #1e3a8a;border-radius:20px;background:#fff}.value{text-align:center;font-size:34px;font-weight:950}.rail{position:relative;margin-top:34px;height:80px;display:flex;align-items:center}input{width:100%;height:50px;margin:0;appearance:none;background:transparent;position:relative;z-index:2}input::-webkit-slider-runnable-track{height:14px;border-radius:7px;background:#bfdbfe}input::-webkit-slider-thumb{appearance:none;width:54px;height:54px;margin-top:-20px;border:5px solid #831843;border-radius:50%;background:#e6007a}.target{position:absolute;z-index:1;left:78%;top:13px;width:42px;height:54px;border-radius:12px;background:#007aff}.success{display:none;height:62px;margin-top:24px;background:#00d084;border-radius:14px;place-items:center;font-weight:950}.done .success{display:grid}
</style></head><body><header>SLIDER SCRUBBING</header><main><div class="ready">READY</div><section class="card"><div class="value" id="value">10</div><div class="rail"><input id="slider" type="range" min="0" max="100" value="10"><i class="target"></i></div><div class="success">SLIDER REACHED TARGET</div></section></main><script>
const range=document.querySelector('#slider'),readout=document.querySelector('#value');range.oninput=()=>{readout.textContent=range.value;if(+range.value>=70)document.body.classList.add('done')};
</script></body></html>
