<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- interactive-widget=resizes-visual is Chrome Android's default; state it so
       the measured geometry here matches what a real embedder sees. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-visual">
  <title>Popcorn host harness</title>
  <style>
    /* The layer expects the page around it not to pinch/rubber-band: an outer
       page zoom shrinks visualViewport and would be misread as a keyboard.
       Any real embedder needs these two lines. */
    html, body { margin: 0; height: 100%; overscroll-behavior: none; touch-action: pan-y; }
    body { background: #14161a; color: #e6e6e6;
           font: 13px/1.45 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    /* LAYOUT RULE (verified on iOS): the viewer iframe must be a plain
       full-viewport fixed box, and any chrome must be LAYERED OVER it.
       Making the iframe a flex child sitting next to
       an `overflow: auto` debug panel puts the iframe in a compositing
       context WebKit rasterises BELOW device scale, and the stream came out visibly
       blurry while every number (framebuffer 980px, canvas 393 CSS px, zoom 1.00)
       was byte-identical to a sharp top-level tab. Same constraint applies to the
       portal: do not shrink the iframe with flex/grid siblings; overlay instead. */
    /* Direct child of body, no wrapper — every extra layer around the iframe is a
       chance for the compositor to rasterise it at the wrong scale. The live rule
       is applied by PopcornHost.layer() (host/popcorn-host.js LAYER_CSS) so the
       harness and every real embedder share one definition; this is the fallback
       for the pre-script paint. */
    iframe { position: fixed; top: 0; left: 0; width: 100%; height: 100%;
             border: 0; background: #111; }

    /* ?badlayout=1 — REPRODUCE the blur, on purpose.
       The shape that was measured soft on device: the iframe as a flex child in a
       transformed, scrolling wrapper. Every number the viewer reports stays
       identical to the sharp case (same framebuffer, same canvas CSS size, same
       zoom) — which is the whole difficulty of this bug, and the reason
       PopcornHost.auditLayout() reports the CAUSE instead of trying to measure the
       effect. Open with &badlayout=1 next to a clean load on the same pod for the
       A/B. */
    body.badlayout #wrap { position: fixed; top: 0; left: 0; right: 0; bottom: 0;
                           display: flex; flex-direction: column; overflow: auto;
                           transform: translateZ(0); will-change: transform; }
    body.badlayout #wrap iframe { position: relative; flex: 1 1 auto;
                                  width: 100%; height: auto; }
    /* Overlay, NOT a sibling that resizes the iframe. Its own layer, so scrolling it
       cannot force a re-raster of the stream beneath. */
    #panel { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
             max-height: 38vh; overflow: auto; padding: 8px 10px;
             border-top: 1px solid #2a2f37; background: rgba(15,17,20,0.92); }
    #row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
    button { flex: 0 0 auto; padding: 8px 12px; font-size: 13px; font-weight: 600; border: 0;
             border-radius: 6px; background: #2f6df6; color: #fff; }
    #geom { font-family: ui-monospace, Menlo, monospace; color: #7ee787; margin-bottom: 4px; }
    #log { font-family: ui-monospace, Menlo, monospace; font-size: 11px; white-space: pre-wrap;
           color: #9aa4b2; margin: 0; }
    body.clean #panel { display: none; }
    .warn { color: #f0883e; }
  </style>
</head>
<body>
  <!-- HARNESS for the embedded-viewer contract (host/popcorn-host.js).
       It is the middle frame of the real deployment shape:

         this page (measures)  ->  liveview iframe (applies the lift)

       With ?nest=1 it instead loads ITSELF one level deeper, giving the full
       three-level chain that the SDK deployment actually has:

         this page (measures)  ->  this page as relay  ->  liveview

       Run (two different ports = two different origins, so this exercises the
       real cross-origin path rather than a same-origin shortcut):

         docker run --rm -it --tmpfs /dev/shm:size=1g -p 6080:6080 -p 9222:9222 \
           popcorn/minimal-vnc-desktop:local
         cd images/minimal-vnc-desktop && python3 -m http.server 8080

       Then open http://localhost:8080/host/test-host.html   (add &nest=1 for the
       three-level chain). On a phone, replace localhost with your machine's LAN
       IP in BOTH the address bar and ?viewer=.

       Add &panel=0 when collecting unobstructed visual evidence. The option is
       forwarded through ?nest=1 so neither host layer covers the viewer.

       Sharpness A/B (the reported Android blur), same pod and same session:
         ...&quality=9&compression=9              -> the layout contract applied
         ...&quality=9&compression=9&badlayout=1  -> iframe left in a flex +
                                                     overflow:auto + transformed
                                                     wrapper
       Both report identical SCALE lines (fb / css / dpr / sc / dev) and render
       differently, which is the whole point of the LAYOUT audit: the cause is
       above the viewer and not measurable from inside it. Add &e2e=1&diag=1 for
       input->paint traces. -->
  <div id="wrap"><iframe id="viewer" title="Popcorn live view"
    allow="clipboard-read; clipboard-write; virtual-keyboard"></iframe></div>
  <div id="panel">
    <div id="row">
      <button id="mag">Magnify</button>
      <button id="kbd">Keyboard</button>
      <button id="paste">Paste</button>
      <button id="sync">Re-sync geom</button>
    </div>
    <div id="geom">geometry: (none sent yet)</div>
    <pre id="log"></pre>
  </div>

  <!-- Cache-busted so a harness rerun cannot silently reuse an older host. -->
  <script src="popcorn-host.js?v=mobile-harness-1"></script>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      if (q.get('panel') === '0') document.body.classList.add('clean');
      var logEl = document.getElementById('log');
      var geomEl = document.getElementById('geom');
      var lines = [];
      function log(s, cls) {
        lines.push((cls === 'warn' ? '! ' : '  ') + new Date().toISOString().slice(11, 23) + ' ' + s);
        if (lines.length > 120) lines.shift();
        logEl.textContent = lines.join('\n');
        logEl.scrollTop = logEl.scrollHeight;
      }

      // Where the pod serves liveview.html. Default assumes the docker run above
      // on the same host; override with ?viewer= for a LAN IP or a real gateway.
      var viewerBase = q.get('viewer') || (location.protocol + '//' + location.hostname + ':6080');
      var relayMode = q.get('relay') === '1';
      var nest = q.get('nest') === '1';

      var iframeEl = document.getElementById('viewer');
      var childUrl;

      // The layout contract, applied the way an embedder should: before src, so
      // reparenting out of #wrap is free (moving a LOADED iframe reloads it, which
      // is why PopcornHost.layer() refuses to do that — see its comment).
      // ?badlayout=1 skips it and leaves the iframe inside the flex/scroll/
      // transform wrapper instead, to reproduce the soft render.
      if (q.get('badlayout') === '1') {
        document.body.className = 'badlayout';
        log('BAD LAYOUT: iframe left inside a flex + overflow:auto + transformed wrapper', 'warn');
      } else {
        PopcornHost.layer(iframeEl, { background: '#111' });
      }

      // Viewer-side knobs, forwarded verbatim to liveview.html so tuning on a device
      // is just editing this page's URL. Everything else (viewer/nest/relay/
      // forcerelay/noorigin/badlayout) is harness-only and stays here. In nested
      // mode these ride down to the middle frame too, or the chain would silently
      // drop them — which is exactly the bug that made the first quality=9 test a
      // no-op.
      //
      // The LIST lives in popcorn-host.js (PopcornHost.VIEWER_PARAMS), not here:
      // every real deployment has the same two hops as this harness, and a
      // parameter that only one of them knows about is a parameter that dies
      // silently at the other. One list, one forwarding function, tested directly
      // (kbd/test/host-embed-params.test.mjs).
      var pass = PopcornHost.forwardParams(location.search);

      if (nest && !relayMode) {
        // Level 1 of 3: load ourselves as the middle (relay) frame. It carries the
        // same viewer target down, plus relay=1 so it forwards instead of measuring.
        // Harness-only knobs that must ALSO survive this hop, because the middle
        // frame is the one that builds the viewer URL: magnify and noorigin were
        // dropped here before, so `&nest=1&magnify=0` silently ran the nested chain
        // in magnify mode — the three-level topology could not be A/B'd at all.
        var nestExtra = [];
        // legacyxlate belongs to the MIDDLE frame — it is that hop's PopcornHost
        // that decides whether to translate the portal's `parent-viewport` message
        // into POPCORN_HOST_GEOMETRY. Leaving it out meant `?nest=1&legacybridge=1
        // &legacyxlate=0` could not reproduce the deployed break at all: the middle
        // frame defaulted the translation back ON and the keyboard worked, which is
        // the OPPOSITE of what that URL claims to demonstrate. (A parameter dying at
        // a hop, in the page whose comments warn about parameters dying at hops.)
        ['viewerpage', 'magnify', 'noorigin', 'badlayout', 'legacyxlate', 'panel'].forEach(function (k) {
          var v = q.get(k);
          if (v !== null) nestExtra.push(k + '=' + encodeURIComponent(v));
        });
        childUrl = location.pathname + '?relay=1&nest=1&viewer=' + encodeURIComponent(viewerBase) +
                   (nestExtra.length ? '&' + nestExtra.join('&') : '') +
                   (pass.length ? '&' + pass.join('&') : '');
        log('nested mode: child is this page in relay mode');
      } else {
        // parentOrigin is what arms the viewer's inbound bridge. Without it the
        // viewer ignores geometry and commands entirely (fail-closed) — the exact
        // misconfiguration this harness should be able to reproduce on purpose,
        // so ?noorigin=1 omits it.
        // magnify=1 by default (the mobile pipeline: CDP reflow to a phone/980px
        // layout + fit + native touch). ?magnify=0 turns it OFF for an apples-to-
        // apples comparison with opening liveview.html directly: no /emulate, no fit
        // dance, so the page shows 1:1 and CROPPED — sharp, but desktop-width and
        // pan-to-read, with noVNC's touch->mouse instead of the /input channel.
        var params = ['magnify=' + (q.get('magnify') === '0' ? '0' : '1')];
        if (q.get('noorigin') !== '1') params.push('parentOrigin=' + encodeURIComponent(location.origin));
        // ?viewerpage= selects WHICH viewer page to load, so a before/after
        // bundle can be A/B'd against the SAME pod and session — the fixed
        // bundle is installed alongside as liveview-fixed.html.
        var viewerPage = q.get('viewerpage') || 'liveview.html';
        childUrl = viewerBase.replace(/\/+$/, '') + '/' + viewerPage + '?' +
                   params.concat(pass).join('&');
      }
      iframeEl.src = childUrl;
      log('child: ' + childUrl);

      // childOrigin: for the nested relay the child is same-origin as us; otherwise
      // it's the pod. Pinning it (rather than '*') is what production should do.
      var childOrigin = nest && !relayMode ? location.origin : new URL(viewerBase).origin;

      // ?legacybridge=1 — REPRODUCE the deployed portal break, on purpose.
      //
      // An integrator's top-level page can measure the viewport correctly and
      // still post it under its OWN message type (an older or hand-rolled
      // bridge, e.g. `{type:'parent-viewport', innerHeight, viewportHeight}`),
      // a message type NOTHING in the chain consumes: popcorn-host.js only
      // forwards POPCORN_HOST_GEOMETRY / POPCORN_TOGGLE_* / POPCORN_PASTE down.
      // So the geometry is dropped at the middle hop.
      //
      // The failure is worse than "no geometry", which is why it needs a real
      // reproduction: the middle frame's PopcornHost sees no upstream sample,
      // times out its 2s grace and starts measuring ITSELF — but it is a
      // cross-origin iframe whose visualViewport never shrinks, so it measures
      // occluded=0 and heartbeats that forever. The viewer then has a FRESH host
      // sample saying "no keyboard", which suppresses its own local detectors.
      // Result: no lift and no pan budget, i.e. exactly the reported symptom.
      //
      // Combine with &nest=1 for the full SDK -> portal -> viewer chain.
      //
      // NOW FIXED, in two independent places, so this mode reproduces the break only
      // with &legacyxlate=0:
      //   * popcorn-host.js translates parent-viewport into POPCORN_HOST_GEOMETRY, so
      //     the geometry survives the hop;
      //   * and even with no translation, a fallback measurer that can see nothing
      //     stays SILENT rather than heartbeating occluded=0 — while the viewer
      //     additionally refuses to let a host that has never seen an occlusion
      //     silence its own detectors. Either half alone is enough to keep the
      //     keyboard working; both together mean a misconfigured embedder degrades
      //     to "no help" instead of "actively broken".
      var legacyBridge = q.get('legacybridge') === '1' && !relayMode;

      // Let the mode RESOLVE (?forcerelay=1 pins it, to test forwarding in
      // isolation). The middle frame of the nested chain should land on 'relay' on
      // its own because the top frame measures — that self-resolution is the thing
      // worth exercising here, since it's what the portal will rely on.
      // In legacy-bridge mode the top frame is pinned to 'relay' so PopcornHost
      // never sends geometry, mirroring the deployed portal (which drives its own
      // hook instead of PopcornHost's measuring path).
      // legacyGeometry (default ON) translates the deployed portal's own
      // `parent-viewport` message into POPCORN_HOST_GEOMETRY, which is what makes
      // that portal work without shipping anything. So ?legacybridge=1 now
      // demonstrates the FIX; add &legacyxlate=0 to turn the translation off and
      // reproduce the original break (no lift, no pan budget, echo pill behind the
      // keys, every keystroke waiting for remote pixels).
      var host = PopcornHost.attach(iframeEl, {
        childOrigin: childOrigin,
        relay: q.get('forcerelay') === '1' || legacyBridge,
        legacyGeometry: q.get('legacyxlate') !== '0',
      });
      // ?fakekbd=NNN — simulate an occluding keyboard NNN px tall, so BOTH halves
      // are testable on a desktop browser (which has no soft keyboard to open).
      // It rides whichever bridge is active, which is what makes the A/B sharp:
      //   ?fakekbd=300                -> POPCORN_HOST_GEOMETRY -> viewer lifts/pans
      //   ?fakekbd=300&legacybridge=1 -> parent-viewport        -> viewer sees NOTHING
      // Toggle live from the console: window.__fakeKbd(300) / window.__fakeKbd(0).
      var fakeKbd = parseInt(q.get('fakekbd') || '0', 10) || 0;

      if (legacyBridge) {
        log('LEGACY BRIDGE: posting parent-viewport (the deployed portal message)', 'warn');
        var legacyPost = function () {
          var vv = window.visualViewport;
          var innerH = window.innerHeight;
          // Honour the simulated keyboard so the break is reproducible without a
          // device: these are the very numbers the deployed portal would send.
          var visH = fakeKbd > 0 ? innerH - fakeKbd : (vv ? vv.height : innerH);
          try {
            iframeEl.contentWindow.postMessage({
              type: 'parent-viewport',
              innerHeight: innerH,
              viewportHeight: visH,
              offsetTop: vv ? (vv.offsetTop || 0) : 0,
              screenHeight: (window.screen && window.screen.height) || null,
              ts: Date.now(),
            }, childOrigin);
          } catch (_) {}
        };
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', legacyPost);
          window.visualViewport.addEventListener('scroll', legacyPost);
        }
        window.addEventListener('resize', legacyPost);
        setInterval(legacyPost, 3000);
        iframeEl.addEventListener('load', legacyPost);
      }

      if (!relayMode) {
        window.__fakeKbd = function (px) {
          fakeKbd = px || 0;
          var h = window.innerHeight;
          if (legacyBridge) {
            // Deployed-portal shape: measured correctly, addressed to nobody.
            legacyPost();
            log('FAKE KBD (legacy parent-viewport) -> visible=' + (fakeKbd > 0 ? h - fakeKbd : h) +
                ' occluded=' + fakeKbd + ' — nothing downstream consumes this');
            return;
          }
          var payload = {
            type: 'POPCORN_HOST_GEOMETRY',
            visibleHeight: fakeKbd > 0 ? h - fakeKbd : h,
            occludedBottom: fakeKbd,
          };
          try { iframeEl.contentWindow.postMessage(payload, childOrigin); } catch (_) {}
          log('FAKE KBD -> visible=' + payload.visibleHeight + ' occluded=' + payload.occludedBottom);
        };
        if (fakeKbd > 0) {
          // Re-post on the same cadence a real host would, so the viewer's 8s
          // staleness window never ages the simulated keyboard out.
          iframeEl.addEventListener('load', function () { setTimeout(function () { window.__fakeKbd(fakeKbd); }, 1200); });
          setInterval(function () { if (fakeKbd > 0) window.__fakeKbd(fakeKbd); }, 3000);
        }
      }
      log('attached -> child ' + childOrigin + ', initial mode=' + host.mode());
      setTimeout(function () { log('mode after upstream grace: ' + host.mode()); }, 2500);

      host.on('hello', function (d) {
        log('HELLO proto=' + d.protocol + ' vk=' + (d.vk ? 1 : 0) + ' vv=' + (d.vv ? 1 : 0) +
            ' magnify=' + (d.magnify ? 1 : 0) + (d.unsupported ? ' unsupported=' + d.unsupported : ''));
        if (!d.vk) log('viewer has no usable VirtualKeyboard API -> host geometry is load-bearing', 'warn');
      });
      host.on('layout', function (a) {
        log('LAYOUT ' + (a.ok ? 'ok' : a.issues.join(',')) + ' reason=' + a.reason +
            ' depth=' + a.depth + ' css=' + a.css.w + 'x' + a.css.h + ' dpr=' + a.dpr,
            a.ok ? '' : 'warn');
      });
      // fb vs CSS vs device px. dev<1 means the phone is upscaling the stream; the
      // A/B against ?badlayout=1 shows identical numbers with a visibly different
      // render, which is exactly why the audit above exists.
      host.on('scale', function (d) {
        log('SCALE fb=' + d.fbWidth + 'x' + d.fbHeight + ' css=' + d.cssWidth + 'x' + d.cssHeight +
            ' dpr=' + d.dpr + ' sc=' + d.scale + ' dev=' + d.deviceScale + ' (' + d.reason + ')');
      });
      host.on('connect', function () { log('CONNECT (rfb handshake)'); });
      host.on('frame', function (d) { log('FRAME first paint fb=' + d.width + 'x' + d.height); });
      host.on('disconnect', function (d) { log('DISCONNECT willReconnect=' + (d.willReconnect ? 1 : 0)); });
      host.on('error', function (d) { log('ERROR ' + d.reason, 'warn'); });
      host.on('kbdstate', function (d) { log('KBD_STATE active=' + (d.active ? 1 : 0) + (d.reason ? ' (' + d.reason + ')' : '')); });
      // The viewer telling US we are breaking its keyboard. Warn-coloured on
      // purpose: every one of these codes means a user-visible failure that the
      // embedder is causing and cannot otherwise see.
      host.on('health', function (d) {
        var det = d.detail && Object.keys(d.detail).length
          ? ' ' + Object.keys(d.detail).map(function (k) { return k + '=' + d.detail[k]; }).join(' ') : '';
        log('HEALTH ' + d.code + det + '  [seen: ' + (d.codes || []).join(',') + ']', 'warn');
      });
      host.on('viewport', function (d) { log('VIEWPORT back: visible=' + Math.round(d.visibleHeight) + ' occluded=' + Math.round(d.occludedBottom)); });

      // Show what we're measuring, so a device test can see at a glance whether
      // THIS frame can see the keyboard at all (the whole question on iOS).
      function renderGeom() {
        var vv = window.visualViewport;
        var vk = navigator.virtualKeyboard;
        var occluded = vv ? Math.max(0, window.innerHeight - vv.height - (vv.offsetTop || 0)) : 0;
        geomEl.textContent =
          'innerH=' + window.innerHeight +
          (vv ? '  vv.h=' + Math.round(vv.height) + ' vv.top=' + Math.round(vv.offsetTop || 0) : '  vv=none') +
          (vk && vk.boundingRect ? '  vk.h=' + Math.round(vk.boundingRect.height) : '  vk=' + (vk ? 'mute' : 'none')) +
          '  => occluded=' + Math.round(occluded) +
          '  top=' + (window === window.top ? 1 : 0) + (relayMode ? '  [relay]' : '');
      }
      renderGeom();
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', renderGeom);
        window.visualViewport.addEventListener('scroll', renderGeom);
      }
      window.addEventListener('resize', renderGeom);
      setInterval(renderGeom, 1000);

      document.getElementById('mag').onclick = function () { host.toggleMagnify(); log('-> toggleMagnify'); };
      document.getElementById('kbd').onclick = function () { host.toggleKeyboard(); log('-> toggleKeyboard'); };
      document.getElementById('sync').onclick = function () { host.syncGeometry(); log('-> syncGeometry'); };
      // Read the clipboard HERE, inside the gesture: this page usually has the
      // permission, whereas a nested cross-origin frame is the most restricted
      // place to ask for it (iOS especially).
      document.getElementById('paste').onclick = function () {
        if (!navigator.clipboard || !navigator.clipboard.readText) { log('no clipboard API here', 'warn'); return; }
        navigator.clipboard.readText().then(function (t) {
          if (!t) { log('clipboard empty', 'warn'); return; }
          host.paste(t); log('-> paste len=' + t.length);
        }).catch(function (e) { log('clipboard read refused: ' + e.name, 'warn'); });
      };
    })();
  </script>
</body>
</html>
