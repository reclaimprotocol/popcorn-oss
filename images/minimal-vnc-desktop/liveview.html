<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live View</title>

  <style>
    html,
    body,
    #screen {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #111;
    }

    /* Kill the browser's own touch gestures so they don't fight the stream:
       overscroll-behavior stops pull-to-refresh and rubber-band scroll globally
       (safe everywhere). In magnify mode we forward every touch to the remote
       ourselves, so touch-action:none disables double-tap-zoom / pan / long-press
       callout on the canvas declaratively — more reliable than preventDefault,
       which can't cancel a passive or already-started gesture. Not applied in
       scale mode, where noVNC drives its own pinch/pan and needs default gestures. */
    html,
    body {
      overscroll-behavior: none;
    }

    #screen.magnify,
    #screen.magnify canvas {
      touch-action: none;
    }

    #screen > canvas {
      outline: none;
    }

    /* The server-side pointer is hidden via unclutter, which makes noVNC blank
       the canvas cursor (sets `cursor: none` when the server cursor is empty).
       Force the viewer to keep showing the user's own machine cursor. noVNC
       nests its canvas (#screen > div > canvas) and sets the cursor inline, so
       a descendant selector with !important is required. */
    #screen canvas {
      cursor: default !important;
    }

    /* Magnify (mobile) view: no pointer. Real touch devices have none, and a
       stray desktop arrow over the magnified page looks wrong. More specific
       than the rule above, so it wins. */
    #screen.nocursor,
    #screen.nocursor canvas {
      cursor: none !important;
    }
  </style>
</head>
<body>
  <!-- STATIC boot/unsupported fallback: plain HTML + table-cell centering, so it
       renders even in engines that don't run our JS (Opera Mini's server-side
       render, time-boxed sandboxes). The module REMOVES it on a real RFB connect,
       so a working browser shows it for a blink then reveals the stream; an engine
       that never runs the JS just keeps showing this message — which is exactly
       what those users need. Centering via display:table (not flex/inset). -->
  <div id="boot-fallback" style="position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;z-index:2147483640;display:table;background:#111;color:#eee;font:15px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
    <div style="display:table-cell;vertical-align:middle;text-align:center;padding:24px">
      <div style="font-size:17px;font-weight:600;margin:0 auto 12px;max-width:22em">Loading live view…</div>
      <div style="margin:0 auto;max-width:26em;opacity:.8">If this message doesn’t disappear in a few seconds, your browser can’t run the live viewer. Please open the link in the latest Chrome or Safari.</div>
    </div>
  </div>

  <div id="screen"></div>
  <script>
    // Classic (ES5) pre-flight gate — runs on EVERY browser, including ones too
    // old to even parse the ES-module viewer below. Two jobs: expose the shared
    // "can't run here" overlay, and PROACTIVELY block environments where the
    // WebSocket pixel stream fundamentally can't work, so the user sees WHY
    // instead of a silent blank #111. Keep this ES5-only (no let/const/arrow/
    // class) — that's the whole point of it being a separate classic script.
    (function () {
      var OVERLAY_ID = 'viewer-overlay';
      // Shared overlay renderer, reused by the reactive connect-failure path in
      // the module below. retry: optional fn -> renders a "Try again" button.
      window.__viewerOverlay = function (title, detail, retry) {
        var el = document.getElementById(OVERLAY_ID);
        if (!el) {
          el = document.createElement('div');
          el.id = OVERLAY_ID;
          // Centering with maximum engine compatibility: CSS TABLE, not flexbox.
          // Opera Mini's server-side renderer (and old WebViews) don't reliably
          // support flexbox / `inset` / `transform`, but display:table +
          // table-cell + vertical-align has worked since the IE8 era. The outer
          // div is the table (fills the viewport with explicit edges), the inner
          // cell vertical-aligns middle and text-aligns center.
          el.setAttribute('style', [
            'position:fixed', 'top:0', 'left:0', 'right:0', 'bottom:0', 'width:100%', 'height:100%',
            'z-index:2147483647', 'display:table', 'background:#111', 'color:#eee',
            'font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif'
          ].join(';'));
          document.body.appendChild(el);
        }
        el.innerHTML = '';
        var cell = document.createElement('div');
        cell.setAttribute('style', 'display:table-cell;vertical-align:middle;text-align:center;padding:24px');
        el.appendChild(cell);

        var h = document.createElement('div');
        h.setAttribute('style', 'font-size:17px;font-weight:600;margin:0 auto 12px;max-width:22em');
        h.textContent = title;
        cell.appendChild(h);
        var p = document.createElement('div');
        p.setAttribute('style', 'margin:0 auto;max-width:26em;opacity:.8');
        p.textContent = detail;
        cell.appendChild(p);
        if (retry) {
          var b = document.createElement('button');
          b.textContent = 'Try again';
          b.setAttribute('style', [
            'display:inline-block', 'margin-top:16px', 'padding:10px 22px', 'font-size:15px', 'font-weight:600',
            'border:0', 'border-radius:8px', 'background:#3a7afe', 'color:#fff', 'cursor:pointer'
          ].join(';'));
          b.onclick = function () {
            if (el.parentNode) el.parentNode.removeChild(el);
            retry();
          };
          cell.appendChild(b);
        }
        return el;
      };
      window.__viewerHideOverlay = function () {
        var el = document.getElementById(OVERLAY_ID);
        if (el && el.parentNode) el.parentNode.removeChild(el);
      };

      // Opera Mini (incl. "extreme"/ultra data-saving): pages are rendered on
      // Opera's servers and shipped as a static snapshot — JS is time-boxed and
      // WebSockets don't work at all, so the live pixel stream can NEVER connect.
      var ua = navigator.userAgent || '';
      var isOperaMini =
        Object.prototype.toString.call(window.operamini) === '[object OperaMini]' ||
        / Opera Mini\//.test(ua);
      // noVNC 1.6 uses modern class syntax (private fields). Old iPadOS/Safari
      // can't PARSE it, so the module viewer dies with a SyntaxError before
      // anything renders. Probe parseability WITHOUT executing noVNC.
      var canParseModern = true;
      try { new Function('class __C { #x = 1; g(){ return this.#x; } }'); }
      catch (e) { canParseModern = false; }

      if (isOperaMini) {
        window.__viewerUnsupported = 'operamini';
        window.__viewerOverlay(
          'Live view can’t run in this mode',
          'Opera’s extreme data-saving (Opera Mini) mode blocks the live connection. Turn off data savings, or open this link in Safari or Chrome.'
        );
      } else if (!canParseModern) {
        window.__viewerUnsupported = 'oldbrowser';
        window.__viewerOverlay(
          'Please update your browser',
          'This browser is too old to run the live viewer. Update your OS/browser, or open this link in the latest Safari or Chrome.'
        );
      }

      // Report that the page ran before the viewer module completes its handshake.
      try {
        parent.postMessage({
          type: 'POPCORN_BOOT',
          unsupported: window.__viewerUnsupported || null,
          ua: navigator.userAgent
        }, '*');
      } catch (e) { /* no parent, or a parent that refuses '*' */ }

      // Surface module evaluation failures to cross-origin embedders.
      if (window.addEventListener) {
        window.addEventListener('error', function (event) {
          try {
            parent.postMessage({
              type: 'POPCORN_BOOT_ERROR',
              msg: String((event && event.message) || ''),
              src: String((event && event.filename) || ''),
              line: (event && event.lineno) || 0
            }, '*');
          } catch (e) { /* see above */ }
        });
      }

      // Reload a stalled viewer a bounded number of times; unsupported browsers skip it.
      // 10s, not something tighter. Worst realistic cold boot is ~114KB gzip over a bad
      // 3G link (~2.5s) plus parsing ~412KB of JS on a slow phone (~1-2s). A deadline
      // near that budget would reload devices that were merely SLOW — and since each
      // reload restarts the download, that makes those sessions strictly worse, not
      // better. Three attempts at 10s still gives up ~22s before the ~52s stream
      // timeout that this replaces.
      var BOOT_DEADLINE_MS = 10000;
      var BOOT_MAX_RETRIES = 2;
      var pcnrMatch = /[?&]__pcnr=(\d+)/.exec(location.search);
      var bootAttempt = pcnrMatch ? (parseInt(pcnrMatch[1], 10) || 0) : 0;

      // Preserve viewer parameters while updating the retry counter.
      function bootUrlForAttempt(n) {
        var base = location.href.split('#')[0].split('?')[0];
        var qs = location.search.replace(/^\?/, '');
        var keep = [];
        if (qs) {
          var parts = qs.split('&');
          for (var i = 0; i < parts.length; i++) {
            if (parts[i] && parts[i].indexOf('__pcnr=') !== 0) keep.push(parts[i]);
          }
        }
        if (n > 0) keep.push('__pcnr=' + n);
        return base + (keep.length ? '?' + keep.join('&') : '') + location.hash;
      }

      if (!window.__viewerUnsupported && window.setTimeout) {
        setTimeout(function () {
          if (window.__viewerBooted) return;
          var willRetry = bootAttempt < BOOT_MAX_RETRIES;
          try {
            parent.postMessage({
              type: 'POPCORN_BOOT_STALL', stage: 'module', attempt: bootAttempt, retrying: willRetry
            }, '*');
          } catch (e) { /* no parent, or a parent that refuses '*' */ }
          if (!willRetry) {
            window.__viewerOverlay(
              'Live view couldn\u2019t start',
              'The viewer didn\u2019t finish loading. Check your connection and try again.',
              function () { location.replace(bootUrlForAttempt(0)); }
            );
            return;
          }
          // replace(), not assign(): a failed attempt must not become a history entry.
          location.replace(bootUrlForAttempt(bootAttempt + 1));
        }, BOOT_DEADLINE_MS);
      }
    })();
  </script>

  <!-- The entire viewer — noVNC core + the kbd/IME layer + this page's
       controller — is bundled by esbuild at build time into one file (see
       viewer.js + the Dockerfile bundler step), so it loads in a single request
       instead of a ~70-module ES-graph waterfall. Served no-store; a module
       script is deferred, so the classic preflight above runs first. -->
  <script type="module" src="viewer.bundle.js"></script>
</body>
</html>
