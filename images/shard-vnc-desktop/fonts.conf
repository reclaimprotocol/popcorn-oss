<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The browser sees only metric-compatible faces renamed to the Windows
     families they replace (rename-fonts.py), so no Linux family name reaches
     a page, and the generics resolve as Chrome on Windows does. -->
<fontconfig>
  <dir>/usr/local/share/fonts-windows</dir>
  <cachedir>/var/cache/fontconfig-shard</cachedir>
  <alias binding="same"><family>sans-serif</family><prefer><family>Arial</family></prefer></alias>
  <alias binding="same"><family>serif</family><prefer><family>Times New Roman</family></prefer></alias>
  <alias binding="same"><family>monospace</family><prefer><family>Courier New</family></prefer></alias>
</fontconfig>
