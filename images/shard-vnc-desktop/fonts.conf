<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The browser sees only faces renamed to the Windows families they stand
     in for (rename-fonts.py), so no Linux family name reaches a page, and the
     generics resolve as Chrome on Windows does. -->
<fontconfig>
  <dir>/usr/local/share/fonts-windows</dir>
  <cachedir>/var/cache/fontconfig-shard</cachedir>
  <alias binding="same"><family>sans-serif</family><prefer><family>Arial</family></prefer></alias>
  <alias binding="same"><family>sans</family><prefer><family>Arial</family></prefer></alias>
  <alias binding="same"><family>system-ui</family><prefer><family>Segoe UI</family></prefer></alias>
  <alias binding="same"><family>serif</family><prefer><family>Times New Roman</family></prefer></alias>
  <alias binding="same"><family>monospace</family><prefer><family>Courier New</family></prefer></alias>
  <alias binding="same"><family>mono</family><prefer><family>Courier New</family></prefer></alias>
  <alias binding="same"><family>emoji</family><prefer><family>Segoe UI Emoji</family></prefer></alias>
  <!-- The CJK faces share their Han glyphs, so pick by page language as
       Windows does. Later prepends win, so regional Chinese follows "zh". -->
  <match target="pattern"><test name="lang" compare="contains"><string>zh</string></test><edit name="family" mode="prepend" binding="strong"><string>Microsoft YaHei</string></edit></match>
  <match target="pattern"><test name="lang" compare="contains"><string>ja</string></test><edit name="family" mode="prepend" binding="strong"><string>Yu Gothic UI</string></edit></match>
  <match target="pattern"><test name="lang" compare="contains"><string>ko</string></test><edit name="family" mode="prepend" binding="strong"><string>Malgun Gothic</string></edit></match>
  <match target="pattern"><test name="lang" compare="contains"><string>zh-tw</string></test><edit name="family" mode="prepend" binding="strong"><string>Microsoft JhengHei</string></edit></match>
  <match target="pattern"><test name="lang" compare="contains"><string>zh-hk</string></test><edit name="family" mode="prepend" binding="strong"><string>Microsoft JhengHei</string></edit></match>
  <match target="pattern"><test name="lang" compare="contains"><string>zh-mo</string></test><edit name="family" mode="prepend" binding="strong"><string>Microsoft JhengHei</string></edit></match>
</fontconfig>
